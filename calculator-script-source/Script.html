  player.characterId=selectedId;
  player.characterLoadPending=true;

    player.characterName=character.name||'Без имени';

    player.characterUsesCurrentState=converted.usesCurrentState;
    player.characterWeapons=converted.weapons;
    player.characterWeaponId=converted.selectedWeaponId;
    player.v8Profile={...defaultV8PlayerProfile(),...converted.profile};
    persistLocal();
    renderPlayerSetup();
    renderInitiative();
    renderSummary();
    if(state.enemies.length&&v8Bundle)void refreshV8Prediction();

  });
  const participantIds=[...out.players.map(player=>player.id),...out.enemies.map(enemy=>enemy.id)];
  const parsedInitiative=parsed?.initiative&&typeof parsed.initiative==='object'?parsed.initiative:{};
  const savedOrder=Array.isArray(parsedInitiative.order)?parsedInitiative.order:[];
  out.initiative={
    activeId:participantIds.includes(parsedInitiative.activeId)?parsedInitiative.activeId:null,
    order:[...savedOrder.filter(id=>participantIds.includes(id)),...participantIds.filter(id=>!savedOrder.includes(id))]
  };
  out.selectedEnemyId=out.enemies.some(enemy=>enemy.id===parsed?.selectedEnemyId)?parsed.selectedEnemyId:(out.enemies[0]?.id||null);
  out.manualDraft=Array.isArray(parsed?.manualDraft)&&parsed.manualDraft.length?parsed.manualDraft.map(r=>( {
    ...defaultManualEnemy(),...r,tagKey:normalizeTagKey(r.tagKey||r.roleKey)
  })):[defaultManualEnemy()];
  out.bestiaryDraft=parsed?.bestiaryDraft||defaultBestiaryDraft();
  out.bestiaryDraft.attacks=ensureTwoAttacks(out.bestiaryDraft.attacks,'humanoid');
  out.bestiaryDraft.reactions=normalizeReactions(out.bestiaryDraft.reactions);
  while(out.bestiaryDraft.reactions.length<DEFAULT_REACTIONS)out.bestiaryDraft.reactions.push(reactionTemplate());
  out.currentScreen=['prep','combat','bestiary'].includes(parsed?.currentScreen)?parsed.currentScreen:'prep';
  return out;
}
function persistLocal() {
  localStorage.setItem(LOCAL_KEY,JSON.stringify(state));
}
function restoreLocal() {
  for(const key of[LOCAL_KEY,'mitriniumEncounterV9','mitriniumEncounterV8','mitriniumEncounterV7','mitriniumEncounterV6','mitriniumEncounterV5','mitriniumEncounterV4','mitriniumEncounterV3','mitriniumEncounterV2','mitriniumEncounterV1']) {
    const raw=localStorage.getItem(key);
    if(!raw)continue;
    try {
      state=normalizeState(JSON.parse(raw));
      applySettings(state.settings);
      return true;
    } catch(error) {
      console.error(error);
    }
  }
  return false;
}
function applySettings(settings) {
  if(!settings)return;
  ['level','difficulty','generationMode','enemyCount','creatureType','humanoidClass','composition'].forEach(key=> {
    const el=document.getElementById(key); if(el&&settings[key]!==undefined)el.value=settings[key];
  });
  applyGeneratorSettingsToUi(settings);
  if(settings.partyInputMode)state.partyInputMode=settings.partyInputMode;
  const partyMode=document.getElementById('partyInputMode');
  if(partyMode)partyMode.value=state.partyInputMode;
}
async function saveToCloud() {
  try {
    const result=await serverCall('saveEncounter',JSON.stringify(state));
    showToast(`Сохранено: ${new Date(result.savedAt).toLocaleString('ru-RU')}`);
  } catch(error) {
    showToast(error.message,true);
  }
}
async function loadFromCloud() {
  try {
    const result=await serverCall('loadEncounter');
    if(!result.found) {
      showToast('Сохранение не найдено.',true);
      return;
    }
    state=normalizeState(JSON.parse(result.payload));
    applySettings(state.settings);
    document.getElementById('players').value=state.players.length;
    persistLocal();
    render();
    if(v8Bundle)await refreshV8Prediction();
    showScreen(state.currentScreen);
    showToast('Сохранение загружено.');
  } catch(error) {
    showToast(error.message,true);
  }
}
async function clearCloudSave() {
  if(!confirm('Удалить серверное сохранение?'))return;
  try {
    await serverCall('clearEncounter');
    showToast('Сохранение удалено.');
  } catch(error) {
    showToast(error.message,true);
  }
}
function openExport() {
  document.getElementById('jsonText').value=JSON.stringify(state,null,2);
  document.getElementById('jsonDialog').showModal();
}
async function copyJson() {
  const text=document.getElementById('jsonText').value;
  try {
    await navigator.clipboard.writeText(text);
    showToast('JSON скопирован.');
  } catch(error) {
    document.getElementById('jsonText').select();
    showToast('Текст выделен.');
  }
}
async function importJson() {
  try {
    state=normalizeState(JSON.parse(document.getElementById('jsonText').value));
    applySettings(state.settings);
    document.getElementById('players').value=state.players.length;
    persistLocal();
    render();
    if(v8Bundle)await refreshV8Prediction();
    document.getElementById('jsonDialog').close();
    showScreen(state.currentScreen);
    showToast('Импорт завершён.');
  } catch(error) {
    showToast(`Ошибка: ${error.message}`,true);
  }
}
function showScreen(name) {
  state.currentScreen=name;
  ['prep','combat','bestiary'].forEach(k=> {
    document.getElementById(`screen-${k}`).classList.toggle('active',k===name); document.getElementById(`tab-${k}`).classList.toggle('active',k===name);
  });
  persistLocal();
  window.scrollTo( {
    top:0,behavior:'smooth'
  });
  if(name==='bestiary')renderModelBreakdown();
}
function render() {
  const targetPzInput=document.getElementById('combatTargetPz');
  if(targetPzInput)targetPzInput.value=clamp(Number(state.combatTargetPz)||4,2,20);
  ['rolls','resources','reactions','visibleToPlayers'].forEach(option=> {
    const input=document.getElementById(`combatLog${option[0].toUpperCase()}${option.slice(1)}`);
    if(input)input.checked=Boolean(state.combatLogging?.[option]);
  });
  renderPlayerSetup();
  renderGenerationMode();
  renderSummary();
  renderInitiative();
  renderEnemyGrid();
  renderCombatAddForm();
  renderLibraries();
  renderBestiaryEditors();
  document.getElementById('roundNumber').textContent=state.round;
}
function showToast(message,isError=false) {
  const toast=document.getElementById('toast');
  toast.textContent=message;
  toast.className=`toast show${isError?' error':''}`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.className='toast',3500);
}
window.addEventListener('load',async()=> {
  try {v8Bundle=await window.mitriniumV8Ready;} catch(error) {showToast(`Не удалось загрузить модель v8: ${error.message}`,true);}
  try {tacticalPregenBank=await window.mitriniumTacticalBankReady;} catch(error) {tacticalPregenBankError=error;console.error(error);showToast(`Не удалось загрузить tactical pregen bank: ${error.message}`,true);}
  try {creaturePregenBank=await window.mitriniumCreatureBankReady;const validation=MitriniumCreaturePregens.validateCreaturePregenBank(creaturePregenBank,{attacks:ATTACK_LIBRARY,reactions:REACTION_LIBRARY});if(!validation.ok)throw new Error(validation.errors.slice(0,5).join('; '));} catch(error) {creaturePregenBankError=error;console.error(error);showToast(`Не удалось загрузить creature pregen bank: ${error.message}`,true);}
  await loadCharacterProfileSources(false);
  initializeControls(); const restored=restoreLocal(); document.getElementById('players').value=state.players.length; document.getElementById('partyInputMode').value=state.partyInputMode; if(!restored)resetBestiaryDraft(); else {
    document.getElementById('beId').value=state.bestiaryDraft.id||''; state.bestiaryDraft.attacks=ensureTwoAttacks(state.bestiaryDraft.attacks,document.getElementById('beType').value);
  }
  render(); showScreen(state.currentScreen||'prep'); onBestiaryArchetypeChange(); if(state.enemies.length&&v8Bundle)await refreshV8Prediction(); await loadEnemyLibrary(false);
});
</script>
