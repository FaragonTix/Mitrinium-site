  const controlMethodDefinitions = [

  const controlMethodLevels = {
    1: { roman: 'I', die: 'фикс +1', methodKey: 'fixed1' },
    2: { roman: 'II', die: 'd4', methodKey: 'd4' },
    3: { roman: 'III', die: 'd6', methodKey: 'd6' },
    4: { roman: 'IV', die: 'd8', methodKey: 'd8' },
    5: { roman: 'V', die: 'd10', methodKey: 'd10' }
  };

  const classControlBonuses = {
    'Психопат': { 'Реагенты': 3, 'Порох': 2 },
    'Кустарь': { 'Пар': 3, 'Кристаллы': 2 },
    'Воротила': { 'Порох': 2, 'Реагенты': 1, 'Кристаллы': 2 },
    'Рекрут': { 'Порох': 3, 'Пар': 2 },
    'Менталист': { 'Кристаллы': 3, 'Реагенты': 1, 'Порох': 1 },
    'Натуралист': { 'Реагенты': 2, 'Кристаллы': 2, 'Порох': 1 }
  };

  const selectedEquipment = [];
  const selectedAbilities = [];

  let activeAbilityId = null;
  let currentCharacterId = null;
  let currentCharacterIsComplete = false;
  let appMode = 'edit';
  let advancedEditMode = false;
  let savedCharactersCache = [];
  let characterControl = createDefaultCharacterControl('');

  function clampControlInteger(value, minimum, maximum, fallback) {
    const parsed = Number(value);
    const safe = Number.isFinite(parsed) ? Math.round(parsed) : fallback;
    return Math.max(minimum, Math.min(maximum, safe));
  }

  function createDefaultCharacterControl(className) {
    const classBonuses = classControlBonuses[String(className || '')] || {};
    const methods = {};

    controlMethodDefinitions.forEach(function (definition) {
      methods[definition.name] = {
        level: 1,
        bonus: Number(classBonuses[definition.name] || 0)
      };
    });

    return { methods: methods };
  }

  function normalizeCharacterControl(value, className) {
    const defaults = createDefaultCharacterControl(className);
    const source = value && typeof value === 'object'
      ? (value.methods && typeof value.methods === 'object' ? value.methods : value)
      : {};

    controlMethodDefinitions.forEach(function (definition) {
      const saved = source[definition.name];
      const savedObject = saved && typeof saved === 'object'
        ? saved
        : {};

      defaults.methods[definition.name] = {
        level: clampControlInteger(savedObject.level, 1, 5, 1),
        bonus: clampControlInteger(
          savedObject.bonus,
          -20,
          20,
          defaults.methods[definition.name].bonus
        )
      };
    });

    return defaults;
  }

  function resetCharacterControlForClass(className) {
    characterControl = createDefaultCharacterControl(className);
    renderControlEditor();

    if (typeof applyCharacterControlMethodToRoll === 'function') {
      applyCharacterControlMethodToRoll();
    }
  }

  function setCharacterControl(value, className) {
    characterControl = normalizeCharacterControl(value, className);
    renderControlEditor();
  }

  function collectCharacterControl() {
    return normalizeCharacterControl(
      characterControl,
      document.getElementById('className')?.value || ''
    );
  }

  function updateCharacterControlMethod(methodName, field, value) {
    const method = characterControl.methods[methodName];
    if (!method) return;

    if (field === 'level') {
      method.level = clampControlInteger(value, 1, 5, 1);
    } else if (field === 'bonus') {
      method.bonus = clampControlInteger(value, -20, 20, 0);
    }

    renderControlEditor();
    refreshViewerIfOpen();

    if (typeof applyCharacterControlMethodToRoll === 'function') {
      applyCharacterControlMethodToRoll();
    }
  }

  function renderControlEditor() {
    const grid = document.getElementById('controlMethodsEditor');
    if (!grid) return;

    grid.innerHTML = controlMethodDefinitions.map(function (definition) {
      const method = characterControl.methods[definition.name];
      const levelOptions = Object.entries(controlMethodLevels)
        .map(function (entry) {
          const level = Number(entry[0]);
          const info = entry[1];
          return `<option value="${level}" ${method.level === level ? 'selected' : ''}>${info.roman} — ${info.die}</option>`;
        })
        .join('');

      return `
        <div class="control-method-editor-row">
          <strong>${definition.name}</strong>

          <label class="field">
            <span>Уровень</span>
            <select onchange="updateCharacterControlMethod('${definition.name}', 'level', this.value)">
              ${levelOptions}
            </select>
          </label>

          <label class="field">
            <span>Классовый бонус</span>
            <input
              type="number"
              min="-20"
              max="20"
              step="1"
              value="${method.bonus}"
              onchange="updateCharacterControlMethod('${definition.name}', 'bonus', this.value)"
            >
          </label>
        </div>
      `;
    }).join('');
  }

  function getClassIcon(className) {
    return classIcons[
      String(className || '')
    ] || '';
  }

  function isRecruitClassIcon(
    className,
    iconValue
  ) {
    return String(className || '') ===
      'Рекрут' || String(iconValue || '') === '⯐';
  }

  function setClassIconGlyph(
    element,
    className,
    iconValue
  ) {
    if (!element) return;

    element.textContent = '';

    if (
      isRecruitClassIcon(
        className,
        iconValue
      )
    ) {
      const recruitSymbol =
        document.createElement('span');

      recruitSymbol.className =
        'recruit-symbol';

      recruitSymbol.setAttribute(
        'aria-hidden',
        'true'
      );

      element.appendChild(recruitSymbol);
      return;
    }

    element.textContent = String(
      iconValue || ''
    );
  }

  function renderClassIconGlyph(
    className,
    iconValue
  ) {
    if (
      isRecruitClassIcon(
        className,
        iconValue
      )
    ) {
      return '<span class="recruit-symbol" aria-hidden="true"></span>';
    }

    return String(iconValue || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  /* =========================
     Режимы приложения
  ========================= */

  function setAppMode(requestedMode) {
    const allowedModes = [
      'edit',
      'view',
      'rolls'
    ];

    const mode =
      allowedModes.includes(requestedMode)
        ? requestedMode
        : 'edit';

    const currentValidationErrors = mode !== 'edit' && typeof validateCharacterOnClient === 'function' && typeof collectCharacterForSave === 'function'
      ? validateCharacterOnClient(collectCharacterForSave())
      : [];
    if (currentValidationErrors.length && typeof setCharacterCompletionStatus === 'function') {
      setCharacterCompletionStatus(false);
    }
    const requiresSavedCharacter = mode === 'view' && !currentCharacterId;
    if (mode !== 'edit' && (requiresSavedCharacter || currentValidationErrors.length)) {
      const message = requiresSavedCharacter
        ? 'Для перехода в «Просмотр» сначала сохраните законченного персонажа.'
        : 'Этот персонаж не закончен. ' + (currentValidationErrors[0] || 'Завершите создание персонажа.') + ' После этого можно открыть «' + (mode === 'rolls' ? 'Броски' : 'Просмотр') + '».';
      if (typeof setSaveStatus === 'function') setSaveStatus(message, true);
      window.alert(message);
      return;
    }

    appMode = mode;

    const modeElements = {
      edit:
        document.getElementById(
          'editMode'
        ),

      view:
        document.getElementById(
          'viewMode'
        ),

      rolls:
        document.getElementById(
          'rollsMode'
        )
    };

    const modeButtons = {
      edit:
        document.getElementById(
          'editModeButton'
        ),

      view:
        document.getElementById(
          'viewModeButton'
        ),

      rolls:
        document.getElementById(
          'rollsModeButton'
        )
    };

    Object.entries(
      modeElements
    ).forEach(function (entry) {
      const key = entry[0];
      const element = entry[1];

      if (!element) {
        return;
      }

      const active =
        key === mode;

      element.hidden = !active;

      element.classList.toggle(
        'hidden',
        !active
      );

      element.setAttribute(
        'aria-hidden',
        active
          ? 'false'
          : 'true'
      );
    });

    Object.entries(
      modeButtons
    ).forEach(function (entry) {
      const key = entry[0];
      const button = entry[1];

      if (!button) {
        return;
      }

      const active =
        key === mode;

      button.classList.toggle(
        'active',
        active
      );

      button.setAttribute(
        'aria-pressed',
        active
          ? 'true'
          : 'false'
      );
    });

    if (
      mode === 'view' &&
      typeof renderCharacterViewer ===
        'function'
    ) {
      renderCharacterViewer();
    }

    if (mode === 'rolls') {
      if (
        typeof renderRollComponentOptions ===
        'function'
      ) {
        renderRollComponentOptions();
      }

      if (
        typeof syncRollBuilderControls ===
        'function'
      ) {
        syncRollBuilderControls();
      }

      if (
        typeof toggleRollControlFields ===
        'function'
      ) {
        toggleRollControlFields();
      }

      if (
        typeof refreshRollLog ===
        'function'
      ) {
        refreshRollLog(false);
      }
    }
  }

  /* =========================

  function toggleAdvancedEditMode(
    isEnabled

    setAdvancedEditMode(

  function setAdvancedEditMode(
    isEnabled

    advancedEditMode =

      checkbox.checked =

      'function'

      renderAbilities();
    }

    if (
      typeof renderRollComponentOptions ===
      'function'
    ) {
      renderRollComponentOptions();
    }

    refreshViewerIfOpen();
  }

  function refreshViewerIfOpen() {

      appMode === 'view' &&
      typeof renderCharacterViewer ===

  /* =========================

  ========================= */

  function ensureClassPickerStyles() {
    if (
      document.getElementById(
        'mitriniumClassPickerStyles'
      )
    ) {
      return;
    }

    const style =
      document.createElement(
        'style'
      );

    style.id =
      'mitriniumClassPickerStyles';

    style.textContent = `
      .class-select-field {
        grid-column: 1 / -1;
      }

      .class-icon-picker {
        display: grid !important;
        grid-template-columns: repeat(6, 48px);
        justify-content: center;
        gap: 8px;
        margin-top: 10px;
      }

      .class-icon-button {
        position: relative;
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        min-width: 48px;
        min-height: 48px;
        border: 2px solid var(--border, #8a6638);
        border-radius: 50%;
        background: var(--button-bg, #ead4aa);
        color: var(--text, #2a1b0f);
        padding: 0;
        font-size: 25px;
        line-height: 1;
        cursor: pointer;
      }

      .class-icon-button-symbol {
        display: block;
        line-height: 1;
        pointer-events: none;
      }

      .class-icon-button-check {
        position: absolute;
        right: 1px;
        bottom: 0;
        display: none;
        place-items: center;
        width: 17px;
        height: 17px;
        border: 1px solid var(--border, #8a6638);
        border-radius: 50%;
        background: var(--panel-light, #fffaf0);
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: 800;
        line-height: 1;
        pointer-events: none;
      }

      .class-icon-button:hover,
      .class-icon-button.selected {
        background: var(--panel-accent, #fff0c8);
        box-shadow:
          0 0 0 3px
          rgba(138, 102, 56, 0.28);
      }

      .class-icon-button.selected
      .class-icon-button-check {
        display: grid;
      }

      .class-icon-label {
        min-height: 24px;
        margin-top: 9px;
        text-align: center;
        font-weight: bold;
      }

      @media (max-width: 390px) {
        .class-icon-picker {
          grid-template-columns:
            repeat(3, 48px);
        }
      }
    `;

    document.head.appendChild(
      style
    );
  }

  function initializeClassIconPicker() {
    ensureClassPickerStyles();

    const select =
      document.getElementById(
        'className'
      );

    if (!select) {
      return;
    }

    const field =
      select.closest('.field') ||
      select.parentElement;

    if (field) {
      field.classList.add(
        'class-select-field'
      );
    }

    let picker =
      document.getElementById(
        'classIconPicker'
      );

    if (!picker) {
      picker =
        document.createElement(
          'div'
        );

      picker.id =
        'classIconPicker';

      picker.className =
        'class-icon-picker';

      picker.setAttribute(
        'role',
        'group'
      );

      picker.setAttribute(
        'aria-label',
        'Выбор класса'
      );

      select.insertAdjacentElement(
        'afterend',
        picker
      );
    }

    /*
      Перестраиваем содержимое, чтобы старые кнопки
      без галочки не оставались в DOM.
    */
    picker.innerHTML = '';

    Object.entries(
      classIcons
    ).forEach(function (entry) {
      const className = entry[0];
      const iconValue = entry[1];

      const button =
        document.createElement(
          'button'
        );

      button.type = 'button';

      button.className =
        'class-icon-button';

      button.dataset.className =
        className;

      button.title = className;

      button.setAttribute(
        'aria-label',
        className
      );

      button.setAttribute(
        'aria-pressed',
        'false'
      );

      const symbol =
        document.createElement(
          'span'
        );

      symbol.className =
        'class-icon-button-symbol';

      symbol.setAttribute(
        'aria-hidden',
        'true'
      );

      setClassIconGlyph(
        symbol,
        className,
        iconValue
      );

      const check =
        document.createElement(
          'span'
        );

      check.className =
        'class-icon-button-check';

      check.setAttribute(
        'aria-hidden',
        'true'
      );

      check.textContent = '✓';

      button.appendChild(symbol);
      button.appendChild(check);

      button.addEventListener(
        'click',
        function () {
          selectClassFromIcon(
            className
          );
        }
      );

      picker.appendChild(
        button
      );
    });

    let label =
      document.getElementById(
        'selectedClassIconLabel'
      );

    if (!label) {
      label =
        document.createElement(
          'div'
        );

      label.id =
        'selectedClassIconLabel';

      label.className =
        'class-icon-label';

      picker.insertAdjacentElement(
        'afterend',
        label
      );
    }

    syncClassIconPicker();
  }

  function selectClassFromIcon(
    className
  ) {
    const select =
      document.getElementById(
        'className'
      );

    if (!select) {
      return;
    }

    if (
      !Object.prototype
        .hasOwnProperty.call(
          classIcons,
          className
        )
    ) {
      return;
    }

    select.value = className;

    select.dispatchEvent(
      new Event(
        'change',
        {
          bubbles: true
        }
      )
    );

    syncClassIconPicker();
  }

  function syncClassIconPicker() {
    const select =
      document.getElementById(
        'className'
      );

    const label =
      document.getElementById(
        'selectedClassIconLabel'
      );

    const selectedClass =
      select
        ? String(
            select.value || ''
          )
        : '';

    document
      .querySelectorAll(
        '.class-icon-button'
      )
      .forEach(function (button) {
        const selected =
          button.dataset.className ===
          selectedClass;

        button.classList.toggle(
          'selected',
          selected
        );

        button.setAttribute(
          'aria-pressed',
          selected
            ? 'true'
            : 'false'
        );
      });

    if (label) {
      label.textContent = '';

      if (selectedClass) {
        const icon =
          document.createElement('span');

        icon.className =
          'selected-class-label-icon';

        icon.setAttribute(
          'aria-hidden',
          'true'
        );

        setClassIconGlyph(
          icon,
          selectedClass,
          getClassIcon(selectedClass)
        );

        const name =
          document.createElement('span');

        name.textContent = selectedClass;

        label.appendChild(icon);
        label.appendChild(name);
      } else {
        label.textContent =
          'Класс не выбран';
      }
    }
  }

  function handleClassChange() {
    const select =
      document.getElementById(
        'className'
      );

    if (!select) {
      return;
    }

    const selectedClass =
      select.value;

    resetCharacterControlForClass(
      selectedClass
    );

    if (
      typeof renderSkills ===
      'function'
    ) {
      renderSkills();
    }

    selectedAbilities.length = 0;
    activeAbilityId = null;

    if (
      typeof renderAbilities ===
      'function'
    ) {
      renderAbilities();
    }

    if (
      typeof renderEquipment ===
      'function'
    ) {
      renderEquipment();
    }

    /*
      Защита от функций перерисовки,
      которые могли поменять select.
    */
    select.value =
      selectedClass;

    syncClassIconPicker();

    if (
      typeof renderRollComponentOptions ===
      'function'
    ) {
      renderRollComponentOptions();
    }

    refreshViewerIfOpen();
  }

  /* =========================
     Запуск интерфейса
  ========================= */

  document.addEventListener(
    'DOMContentLoaded',
    function () {
      if (
        typeof renderAttributes ===
        'function'
      ) {
        renderAttributes();
      }

      if (
        typeof renderSkills ===
        'function'
      ) {
        renderSkills();
      }

      if (
        typeof renderAbilities ===
        'function'
      ) {
        renderAbilities();
      }

      if (
        typeof renderEquipment ===
        'function'
      ) {
        renderEquipment();
      }

      renderControlEditor();

      const equipmentSearch =
        document.getElementById(
          'equipmentSearch'
        );

      if (
        equipmentSearch &&
        equipmentSearch.dataset
          .coreSearchHandler !==
          'true'
      ) {
        equipmentSearch.addEventListener(
          'input',
          renderEquipment
        );

        equipmentSearch.dataset
          .coreSearchHandler =
          'true';
      }

      initializeClassIconPicker();

      const editMode = document.getElementById('editMode');
      if (editMode) {
        const refreshCompletion = function () {
          window.setTimeout(function () {
            if (typeof collectCharacterForSave !== 'function' || typeof validateCharacterOnClient !== 'function') return;
            setCharacterCompletionStatus(validateCharacterOnClient(collectCharacterForSave()).length === 0);
          }, 0);
        };
        editMode.addEventListener('input', refreshCompletion);
        editMode.addEventListener('change', refreshCompletion);
        editMode.addEventListener('click', refreshCompletion);
      }

      const classSelect =
        document.getElementById(
          'className'
        );

      if (
        classSelect &&
        classSelect.dataset
          .coreClassHandler !==
          'true'
      ) {
        classSelect.addEventListener(
          'change',
          handleClassChange
        );

        classSelect.dataset
          .coreClassHandler =
          'true';
      }

      if (
        typeof setLoadStatus ===
        'function'
      ) {
        setLoadStatus(
          'Список не загружен. ' +
          'Нажмите «Обновить список».',
          false
        );
      }

      setAppMode('edit');
    }
  );
</script>
