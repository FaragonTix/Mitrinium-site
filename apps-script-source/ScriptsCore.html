  const controlMethodDefinitions = [

    { name: 'Кристаллы', key: 'crystals' },
    { name: 'Реагенты', key: 'reagents' }
  ];

  const classControlBonuses = {
    'Психопат': { 'Реагенты': 1, 'Порох': 1, 'Пар': 1 },
    'Кустарь': { 'Пар': 1, 'Кристаллы': 1, 'Реагенты': 1 },
    'Воротила': { 'Порох': 1, 'Реагенты': 1, 'Кристаллы': 1 },
    'Рекрут': { 'Порох': 1, 'Пар': 1, 'Реагенты': 1 },
    'Менталист': { 'Кристаллы': 1, 'Реагенты': 1, 'Порох': 1 },
    'Натуралист': { 'Реагенты': 1, 'Кристаллы': 1, 'Порох': 1 }
  };
  const startingControlPoints = 3;

  const selectedEquipment = [];
  const selectedAbilities = [];

  let activeAbilityId = null;
  let currentCharacterId = null;
  let currentCharacterIsComplete = false;
  let appMode = 'edit';
  let advancedEditMode = false;
  let savedCharactersCache = [];
  let characterControl = createDefaultCharacterControl('');

  function clampControlInteger(value, minimum, maximum, fallback) {
    const parsed = Number(value);
    const safe = Number.isFinite(parsed) ? Math.round(parsed) : fallback;
    return Math.max(minimum, Math.min(maximum, safe));
  }

  function createDefaultCharacterControl(className) {
    const classBonuses = classControlBonuses[String(className || '')] || {};
    const methods = {};

    controlMethodDefinitions.forEach(function (definition) {
      methods[definition.name] = {
        bonus: Number(classBonuses[definition.name] || 0)
      };
    });

    return { methods: methods };
  }

  function normalizeCharacterControl(value, className) {
    const defaults = createDefaultCharacterControl(className);
    const source = value && typeof value === 'object'
      ? (value.methods && typeof value.methods === 'object' ? value.methods : value)
      : {};

    controlMethodDefinitions.forEach(function (definition) {
      const saved = source[definition.name];
      const savedObject = saved && typeof saved === 'object'
        ? saved
        : {};

      defaults.methods[definition.name] = {
        bonus: Math.max(
          defaults.methods[definition.name].bonus,
          clampControlInteger(
            savedObject.bonus,
            0,
            20,
            defaults.methods[definition.name].bonus
          )
        )
      };
    });

    return defaults;
  }

  function resetCharacterControlForClass(className) {
    characterControl = createDefaultCharacterControl(className);
    renderControlEditor();

    if (typeof applyCharacterControlMethodToRoll === 'function') {
      applyCharacterControlMethodToRoll();
    }
  }

  function setCharacterControl(value, className) {
    characterControl = normalizeCharacterControl(value, className);
    renderControlEditor();
  }

  function collectCharacterControl() {
    return normalizeCharacterControl(
      characterControl,
      document.getElementById('className')?.value || ''
    );
  }

  function getBaseControlBonus(className, methodName) {
    return Number(classControlBonuses[String(className || '')]?.[methodName] || 0);
  }

  function getSpentControlPoints() {
    const className = document.getElementById('className')?.value || '';
    return controlMethodDefinitions.reduce(function (sum, definition) {
      const current = Number(characterControl.methods[definition.name]?.bonus || 0);
      return sum + Math.max(0, current - getBaseControlBonus(className, definition.name));
    }, 0);
  }

  function getControlPointsLeft() {
    return startingControlPoints - getSpentControlPoints();
  }

  function updateCharacterControlMethod(methodName, field, value) {
    const method = characterControl.methods[methodName];
    if (!method) return;

    if (field !== 'bonus' || !advancedEditMode) return;
    method.bonus = clampControlInteger(value, 0, 20, 0);

    renderControlEditor();
    refreshViewerIfOpen();
    if (typeof applyCharacterControlMethodToRoll === 'function') applyCharacterControlMethodToRoll();
  }

  function changeCharacterControlBonus(methodName, delta) {
    const method = characterControl.methods[methodName];
    if (!method) return;
    const className = document.getElementById('className')?.value || '';
    const minimum = advancedEditMode ? 0 : getBaseControlBonus(className, methodName);
    const next = Number(method.bonus || 0) + Number(delta || 0);
    if (next < minimum || next > 20) return;
    if (!advancedEditMode && delta > 0 && getControlPointsLeft() <= 0) return;
    method.bonus = next;

    renderControlEditor();
    refreshViewerIfOpen();

    if (typeof applyCharacterControlMethodToRoll === 'function') {
      applyCharacterControlMethodToRoll();
    }
  }

  function renderControlEditor() {
    const grid = document.getElementById('controlMethodsEditor');
    const pointsLeft = document.getElementById('controlPointsLeft');
    if (!grid) return;

    if (pointsLeft) {
      pointsLeft.textContent = advancedEditMode ? 'режим развития' : getControlPointsLeft();
    }

    grid.innerHTML = controlMethodDefinitions.map(function (definition) {
      const method = characterControl.methods[definition.name];
      const className = document.getElementById('className')?.value || '';
      const isClassMethod = getBaseControlBonus(className, definition.name) > 0;

      return `
        <div class="control-method-editor-row ${isClassMethod ? 'class-method' : ''}">
          <div>
            <strong>${definition.name}</strong>
            <small>${isClassMethod ? 'Основная Методика · стартовый +1' : 'Дополнительная Методика'}</small>
          </div>
          <div class="mini-counter">
            <button type="button" onclick="changeCharacterControlBonus('${definition.name}', -1)">−</button>
            ${advancedEditMode
              ? `<input type="number" min="0" max="20" step="1" value="${method.bonus}" onchange="updateCharacterControlMethod('${definition.name}', 'bonus', this.value)">`
              : `<strong>${method.bonus >= 0 ? '+' : ''}${method.bonus}</strong>`}
            <button type="button" onclick="changeCharacterControlBonus('${definition.name}', 1)">+</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function getClassIcon(className) {
    return classIcons[
      String(className || '')
    ] || '';
  }

  function isRecruitClassIcon(
    className,
    iconValue
  ) {
    return String(className || '') ===
      'Рекрут' || String(iconValue || '') === '⯐';
  }

  function setClassIconGlyph(
    element,
    className,
    iconValue
  ) {
    if (!element) return;

    element.textContent = '';

    if (
      isRecruitClassIcon(
        className,
        iconValue
      )
    ) {
      const recruitSymbol =
        document.createElement('span');

      recruitSymbol.className =
        'recruit-symbol';

      recruitSymbol.setAttribute(
        'aria-hidden',
        'true'
      );

      element.appendChild(recruitSymbol);
      return;
    }

    element.textContent = String(
      iconValue || ''
    );
  }

  function renderClassIconGlyph(
    className,
    iconValue
  ) {
    if (
      isRecruitClassIcon(
        className,
        iconValue
      )
    ) {
      return '<span class="recruit-symbol" aria-hidden="true"></span>';
    }

    return String(iconValue || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  /* =========================
     Режимы приложения
  ========================= */

  function setAppMode(requestedMode) {
    const allowedModes = [
      'edit',
      'view',
      'rolls'
    ];

    const mode =
      allowedModes.includes(requestedMode)
        ? requestedMode
        : 'edit';

    const currentValidationErrors = mode !== 'edit' && typeof validateCharacterOnClient === 'function' && typeof collectCharacterForSave === 'function'
      ? validateCharacterOnClient(collectCharacterForSave())
      : [];
    if (currentValidationErrors.length && typeof setCharacterCompletionStatus === 'function') {
      setCharacterCompletionStatus(false);
    }
    const requiresSavedCharacter = mode === 'view' && !currentCharacterId;
    if (mode !== 'edit' && (requiresSavedCharacter || currentValidationErrors.length)) {
      const message = requiresSavedCharacter
        ? 'Для перехода в «Просмотр» сначала сохраните законченного персонажа.'
        : 'Этот персонаж не закончен. ' + (currentValidationErrors[0] || 'Завершите создание персонажа.') + ' После этого можно открыть «' + (mode === 'rolls' ? 'Броски' : 'Просмотр') + '».';
      if (typeof setSaveStatus === 'function') setSaveStatus(message, true);
      window.alert(message);
      return;
    }

    appMode = mode;

    const modeElements = {
      edit:
        document.getElementById(
          'editMode'
        ),

      view:
        document.getElementById(
          'viewMode'
        ),

      rolls:
        document.getElementById(
          'rollsMode'
        )
    };

    const modeButtons = {
      edit:
        document.getElementById(
          'editModeButton'
        ),

      view:
        document.getElementById(
          'viewModeButton'
        ),

      rolls:
        document.getElementById(
          'rollsModeButton'
        )
    };

    Object.entries(
      modeElements
    ).forEach(function (entry) {
      const key = entry[0];
      const element = entry[1];

      if (!element) {
        return;
      }

      const active =
        key === mode;

      element.hidden = !active;

      element.classList.toggle(
        'hidden',
        !active
      );

      element.setAttribute(
        'aria-hidden',
        active
          ? 'false'
          : 'true'
      );
    });

    Object.entries(
      modeButtons
    ).forEach(function (entry) {
      const key = entry[0];
      const button = entry[1];

      if (!button) {
        return;
      }

      const active =
        key === mode;

      button.classList.toggle(
        'active',
        active
      );

      button.setAttribute(
        'aria-pressed',
        active
          ? 'true'
          : 'false'
      );
    });

    if (
      mode === 'view' &&
      typeof renderCharacterViewer ===
        'function'
    ) {
      renderCharacterViewer();
    }

    if (mode === 'rolls') {
      if (
        typeof renderRollComponentOptions ===
        'function'
      ) {
        renderRollComponentOptions();
      }

      if (
        typeof syncRollBuilderControls ===
        'function'
      ) {
        syncRollBuilderControls();
      }

      if (
        typeof toggleRollControlFields ===
        'function'
      ) {
        toggleRollControlFields();
      }

      if (
        typeof refreshRollLog ===
        'function'
      ) {
        refreshRollLog(false);
      }
    }
  }

  /* =========================
     Режим развития
  ========================= */

  function toggleAdvancedEditMode(
    isEnabled
  ) {
    setAdvancedEditMode(
      isEnabled
    );
  }

  function setAdvancedEditMode(
    isEnabled
  ) {
    advancedEditMode =
      Boolean(isEnabled);

    const checkbox =
      document.getElementById(
        'advancedEditMode'
      );

    if (checkbox) {
      checkbox.checked =
        advancedEditMode;
    }

    if (
      typeof renderAttributes ===
      'function'
    ) {
      renderAttributes();
    }

    if (
      typeof renderSkills ===
      'function'
    ) {
      renderSkills();
    }

    if (
      typeof renderAbilities ===
        'function'
    ) {
      renderAbilities();
    }

    renderControlEditor();

    if (
      typeof renderRollComponentOptions ===
      'function'
    ) {
      renderRollComponentOptions();
    }

    refreshViewerIfOpen();
  }

  function refreshViewerIfOpen() {
    if (
      appMode === 'view' &&
      typeof renderCharacterViewer ===
        'function'
    ) {
      renderCharacterViewer();
    }
  }

  function initializeClassIconPicker() {
    ensureClassPickerStyles();

    const select =
      document.getElementById(
        'className'
      );

    if (!select) {
      return;
    }

    const field =
      select.closest('.field') ||
      select.parentElement;

    if (field) {
      field.classList.add(
        'class-select-field'
      );
    }

    let picker =
      document.getElementById(
        'classIconPicker'
      );

    if (!picker) {
      picker =
        document.createElement(
          'div'
        );

      picker.id =
        'classIconPicker';

      picker.className =
        'class-icon-picker';

      picker.setAttribute(
        'role',
        'group'
      );

      picker.setAttribute(
        'aria-label',
        'Выбор класса'
      );

      select.insertAdjacentElement(
        'afterend',
        picker
      );
    }

    /*
      Перестраиваем содержимое, чтобы старые кнопки
      без галочки не оставались в DOM.
    */
    picker.innerHTML = '';

    Object.entries(
      classIcons
    ).forEach(function (entry) {
      const className = entry[0];
      const iconValue = entry[1];

      const button =
        document.createElement(
          'button'
        );

      button.type = 'button';

      button.className =
        'class-icon-button';

      button.dataset.className =
        className;

      button.title = className;

      button.setAttribute(
        'aria-label',
        className
      );

      button.setAttribute(
        'aria-pressed',
        'false'
      );

      const symbol =
        document.createElement(
          'span'
        );

      symbol.className =
        'class-icon-button-symbol';

      symbol.setAttribute(
        'aria-hidden',
        'true'
      );

      setClassIconGlyph(
        symbol,
        className,
        iconValue
      );

      const check =
        document.createElement(
          'span'
        );

      check.className =
        'class-icon-button-check';

      check.setAttribute(
        'aria-hidden',
        'true'
      );

      check.textContent = '✓';

      button.appendChild(symbol);
      button.appendChild(check);

      button.addEventListener(
        'click',
        function () {
          selectClassFromIcon(
            className
          );
        }
      );

      picker.appendChild(
        button
      );
    });

    let label =
      document.getElementById(
        'selectedClassIconLabel'
      );

    if (!label) {
      label =
        document.createElement(
          'div'
        );

      label.id =
        'selectedClassIconLabel';

      label.className =
        'class-icon-label';

      picker.insertAdjacentElement(
        'afterend',
        label
      );
    }

    syncClassIconPicker();
  }

  function selectClassFromIcon(
    className
  ) {
    const select =
      document.getElementById(
        'className'
      );

    if (!select) {
      return;
    }

    if (
      !Object.prototype
        .hasOwnProperty.call(
          classIcons,
          className
        )
    ) {
      return;
    }

    select.value = className;

    select.dispatchEvent(
      new Event(
        'change',
        {
          bubbles: true
        }
      )
    );

    syncClassIconPicker();
  }

  function syncClassIconPicker() {
    const select =
      document.getElementById(
        'className'
      );

    const label =
      document.getElementById(
        'selectedClassIconLabel'
      );

    const selectedClass =
      select
        ? String(
            select.value || ''
          )
        : '';

    document
      .querySelectorAll(
        '.class-icon-button'
      )
      .forEach(function (button) {
        const selected =
          button.dataset.className ===
          selectedClass;

        button.classList.toggle(
          'selected',
          selected
        );

        button.setAttribute(
          'aria-pressed',
          selected
            ? 'true'
            : 'false'
        );
      });

    if (label) {
      label.textContent = '';

      if (selectedClass) {
        const icon =
          document.createElement('span');

        icon.className =
          'selected-class-label-icon';

        icon.setAttribute(
          'aria-hidden',
          'true'
        );

        setClassIconGlyph(
          icon,
          selectedClass,
          getClassIcon(selectedClass)
        );

        const name =
          document.createElement('span');

        name.textContent = selectedClass;

        label.appendChild(icon);
        label.appendChild(name);
      } else {
        label.textContent =
          'Класс не выбран';
      }
    }
  }

  function handleClassChange() {
    const select =
      document.getElementById(
        'className'
      );

    if (!select) {
      return;
    }

    const selectedClass =
      select.value;

    resetCharacterControlForClass(
      selectedClass
    );

    if (
      typeof renderSkills ===
      'function'
    ) {
      renderSkills();
    }

    selectedAbilities.length = 0;
    activeAbilityId = null;

    if (
      typeof renderAbilities ===
      'function'
    ) {
      renderAbilities();
    }

    if (
      typeof renderEquipment ===
      'function'
    ) {
      renderEquipment();
    }

    /*
      Защита от функций перерисовки,
      которые могли поменять select.
    */
    select.value =
      selectedClass;

    syncClassIconPicker();

    if (
      typeof renderRollComponentOptions ===
      'function'
    ) {
      renderRollComponentOptions();
    }

    refreshViewerIfOpen();
  }

  /* =========================
     Запуск интерфейса
  ========================= */

  document.addEventListener(
    'DOMContentLoaded',
    function () {
      if (
        typeof renderAttributes ===
        'function'
      ) {
        renderAttributes();
      }

      if (
        typeof renderSkills ===
        'function'
      ) {
        renderSkills();
      }

      if (
        typeof renderAbilities ===
        'function'
      ) {
        renderAbilities();
      }

      if (
        typeof renderEquipment ===
        'function'
      ) {
        renderEquipment();
      }

      renderControlEditor();

      const equipmentSearch =
        document.getElementById(
          'equipmentSearch'
        );

      if (
        equipmentSearch &&
        equipmentSearch.dataset
          .coreSearchHandler !==
          'true'
      ) {
        equipmentSearch.addEventListener(
          'input',
          renderEquipment
        );

        equipmentSearch.dataset
          .coreSearchHandler =
          'true';
      }

      initializeClassIconPicker();

      const editMode = document.getElementById('editMode');
      if (editMode) {
        const refreshCompletion = function () {
          window.setTimeout(function () {
            if (typeof collectCharacterForSave !== 'function' || typeof validateCharacterOnClient !== 'function') return;
            setCharacterCompletionStatus(validateCharacterOnClient(collectCharacterForSave()).length === 0);
          }, 0);
        };
        editMode.addEventListener('input', refreshCompletion);
        editMode.addEventListener('change', refreshCompletion);
        editMode.addEventListener('click', refreshCompletion);
      }

      const classSelect =
        document.getElementById(
          'className'
        );

      if (
        classSelect &&
        classSelect.dataset
          .coreClassHandler !==
          'true'
      ) {
        classSelect.addEventListener(
          'change',
          handleClassChange
        );

        classSelect.dataset
          .coreClassHandler =
          'true';
      }

      if (
        typeof setLoadStatus ===
        'function'
      ) {
        setLoadStatus(
          'Список не загружен. ' +
          'Нажмите «Обновить список».',
          false
        );
      }

      setAppMode('edit');
    }
  );
</script>
