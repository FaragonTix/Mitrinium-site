<script>
  // Сохранение, загрузка, поиск и скрытие персонажей.

  let savedCharactersListIsAdmin = false;
  let hiddenCharactersCount = 0;
  let hiddenSavedCharactersCache = [];
  let savedCharacterFoldersCache = [];
  let showPersonallyHiddenCharacters = false;
  let characterDeletionPolicy = 'forbidden';

  function setSaveStatus(
    message,
    isError
  ) {
    const status =
      document.getElementById(
        'saveStatus'
      );

    if (!status) {
      return;
    }

    status.textContent = message || '';

    status.className = isError
      ? 'save-status error'
      : 'save-status success';
  }

  function saveCurrentCharacter(forceDraft) {
    const character =
      collectCharacterForSave();

    const errors =
      validateCharacterOnClient(
        character
      );

    if (errors.length > 0 && !forceDraft) {
      setSaveStatus(
        errors.join(' '),
        true
      );
      const dialog = document.getElementById('draftSaveDialog');
      const errorText = document.getElementById('draftSaveErrors');
      if (errorText) errorText.textContent = errors.join(' ');
      if (dialog && typeof dialog.showModal === 'function') dialog.showModal();
      return;
    }

    character.isComplete = errors.length === 0;
    const dialog = document.getElementById('draftSaveDialog');
    if (dialog && dialog.open) dialog.close();

    setSaveStatus(
      'Сохраняю...',
      false
    );

    google.script.run
      .withSuccessHandler(
        function (result) {
          currentCharacterId =
            result.id;
          setCharacterCompletionStatus(result.isComplete !== false);

          setSaveStatus(
            result.isComplete === false
              ? 'Черновик сохранён. Персонаж пока не закончен.'
              : 'Персонаж сохранён. Список не обновлялся автоматически.',
            false
          );
        }
      )
      .withFailureHandler(
        function (error) {
          setSaveStatus(
            error.message ||
              'Ошибка сохранения.',
            true
          );
        }
      )
      .mitriniumSaveCharacter(
        character
      );
  }

  function setLoadStatus(
    message,
    isError
  ) {
    const status =
      document.getElementById(
        'loadStatus'
      );

    if (!status) {
      return;
    }

    status.textContent = message || '';

    status.className = isError
      ? 'save-status error'
      : 'save-status success';
  }

  function ensureSavedCharacterSearch() {
    const list =
      document.getElementById(
        'savedCharactersList'
      );

    const status =
      document.getElementById(
        'loadStatus'
      );

    if (
      !list ||
      document.getElementById(
        'savedCharacterSearch'
      )
    ) {
      return;
    }

    const wrapper =
      document.createElement('div');

    wrapper.className =
      'saved-character-search';

    wrapper.innerHTML = `
      <label
        for="savedCharacterSearch"
        class="field"
      >
        <span>
          Поиск по сохранённым персонажам
        </span>

        <input
          type="search"
          id="savedCharacterSearch"
          placeholder="Имя, игрок, класс или email"
          autocomplete="off"
        >
      </label>
    `;

    if (
      status &&
      status.parentNode
    ) {
      status.parentNode.insertBefore(
        wrapper,
        status
      );
    } else if (list.parentNode) {
      list.parentNode.insertBefore(
        wrapper,
        list
      );
    }

    const searchInput =
      document.getElementById(
        'savedCharacterSearch'
      );

    if (searchInput) {
      searchInput.addEventListener(
        'input',
        filterSavedCharactersList
      );
    }
  }

  function escapeSavedCharacterText(
    value
  ) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeSavedCharacterJs(
    value
  ) {
    return String(value || '')
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'");
  }

  function filterSavedCharactersList() {
    renderSavedCharactersList();
  }

  function organizeSavedCharactersIntoFolders(list) {
    if (!savedCharactersListIsAdmin || !list) return;

    const cards = Array.from(list.querySelectorAll('.saved-character-item'));
    const folders = savedCharacterFoldersCache.slice();
    const knownFolderIds = new Set(folders.map(function(folder) {
      return String(folder.id || '');
    }));

    cards.forEach(function(card) {
      const folderId = String(card.dataset.folderId || '');
      if (folderId && !knownFolderIds.has(folderId)) {
        folders.push({ id: folderId, name: card.dataset.folderName || 'Папка' });
        knownFolderIds.add(folderId);
      }
    });

    const groups = folders.map(function(folder) {
      return {
        id: String(folder.id || ''),
        name: String(folder.name || 'Папка'),
        cards: cards.filter(function(card) {
          return String(card.dataset.folderId || '') === String(folder.id || '');
        })
      };
    });
    groups.push({
      id: '',
      name: 'Без папки',
      cards: cards.filter(function(card) { return !card.dataset.folderId; })
    });

    list.innerHTML = '';
    groups.filter(function(group) { return group.cards.length > 0; }).forEach(function(group) {
      const section = document.createElement('details');
      section.className = 'saved-character-folder';
      section.open = true;

      const summary = document.createElement('summary');
      summary.innerHTML = '<span>' + escapeSavedCharacterText(group.name) + '</span><strong>' + group.cards.length + '</strong>';

      const body = document.createElement('div');
      body.className = 'saved-character-folder-list';
      group.cards.forEach(function(card) { body.appendChild(card); });

      section.appendChild(summary);
      section.appendChild(body);
      list.appendChild(section);
    });
  }

  function renderSavedCharactersList() {
    const list =
      document.getElementById(
        'savedCharactersList'
      );

    const searchInput =
      document.getElementById(
        'savedCharacterSearch'
      );

    if (!list) {
      return;
    }

    const query = String(
      searchInput
        ? searchInput.value
        : ''
    )
      .trim()
      .toLocaleLowerCase('ru-RU');

    const sourceCharacters = showPersonallyHiddenCharacters
      ? savedCharactersCache.concat(hiddenSavedCharactersCache)
      : savedCharactersCache;

    const filteredCharacters =
      sourceCharacters.filter(
        function (character) {
          if (!query) {
            return true;
          }

          const searchableText = [
            character.name,
            character.player,
            character.className,
            character.ownerEmail
          ]
            .join(' ')
            .toLocaleLowerCase(
              'ru-RU'
            );

          return (
            searchableText.indexOf(
              query
            ) !== -1
          );
        }
      );

    if (sourceCharacters.length === 0) {
      list.innerHTML = '';

      setLoadStatus(
        hiddenCharactersCount > 0 && !showPersonallyHiddenCharacters
          ? 'Все персонажи скрыты в вашем личном списке.'
          : 'Сохранённых персонажей пока нет.',
        false
      );

      renderHiddenCharactersControls();
      return;
    }

    if (
      filteredCharacters.length === 0
    ) {
      setLoadStatus(
        'По запросу ничего не найдено.',
        false
      );

      list.innerHTML = `
        <div class="empty-note">
          Попробуйте другое имя,
          класс, игрока или email.
        </div>
      `;

      renderHiddenCharactersControls();
      return;
    }

    if (query) {
      setLoadStatus(
        'Показано персонажей: ' +
          filteredCharacters.length +
          ' из ' +
          sourceCharacters.length,
        false
      );
    } else {
      setLoadStatus(
        'Найдено персонажей: ' +
          sourceCharacters.length,
        false
      );
    }

    list.innerHTML =
      filteredCharacters
        .map(function (character) {
          const characterId =
            escapeSavedCharacterJs(
              character.id
            );

          const name =
            escapeSavedCharacterText(
              character.name ||
                'Без имени'
            );

          const className =
            escapeSavedCharacterText(
              character.className ||
                'Класс не указан'
            );

          const level = Math.max(
            1,
            Math.min(
              20,
              Math.round(Number(character.level) || 1)
            )
          );

          const icon =
            typeof getClassIcon ===
            'function'
              ? getClassIcon(
                  character.className
                )
              : '';

          const player =
            character.player
              ? ' · игрок: ' +
                escapeSavedCharacterText(
                  character.player
                )
              : '';

          const ownerEmail =
            character.ownerEmail
              ? ' · ' +
                escapeSavedCharacterText(
                  character.ownerEmail
                )
              : '';

          const draftBadge = character.isComplete === false
            ? '<span class="character-draft-chip">не закончен</span>'
            : '';

          const hideButton = character.personallyHidden
            ? `
              <button
                type="button"
                class="equipment-button saved-character-hide-button"
                onclick="restoreCharacterToOwnerList('${characterId}')"
              >
                Показывать
              </button>
            `
            : `
              <button
                type="button"
                class="equipment-button saved-character-hide-button"
                onclick="hideCharacterFromOwnerList('${characterId}')"
              >
                Скрыть из списка
              </button>
            `;

          const deleteButton = !savedCharactersListIsAdmin && characterDeletionPolicy !== 'forbidden'
            ? `
              <button
                type="button"
                class="equipment-button saved-character-hide-button"
                onclick="deleteOwnCharacterFromList('${characterId}')"
              >
                Удалить
              </button>
            `
            : '';

          return `
            <div
              class="saved-character-item ${character.personallyHidden ? 'personally-hidden' : ''}"
              data-folder-id="${escapeSavedCharacterText(character.folderId || '')}"
              data-folder-name="${escapeSavedCharacterText(character.folderName || '')}"
            >
              <div>
                <div class="saved-character-name">
                  ${
                    icon
                      ? `
                        <span
                          class="class-icon-inline"
                          aria-hidden="true"
                        >
                          ${renderClassIconGlyph(
                            character.className,
                            icon
                          )}
                        </span>
                      `
                      : ''
                  }

                  ${name} ${draftBadge}
                </div>

                <div class="saved-character-meta">
                  ${className}
                  · уровень ${level}
                  ${player}
                  ${ownerEmail}
                </div>
              </div>

              <div class="saved-character-actions">
                <button
                  type="button"
                  class="equipment-button"
                  onclick="loadCharacterForEdit(
                    '${characterId}'
                  )"
                >
                  Загрузить
                </button>

                ${hideButton}
                ${deleteButton}
              </div>
            </div>
          `;
        })
        .join('');

    organizeSavedCharactersIntoFolders(list);

    renderHiddenCharactersControls();
  }

  function loadSavedCharactersList() {
    const list =
      document.getElementById(
        'savedCharactersList'
      );

    if (!list) {
      return;
    }

    ensureSavedCharacterSearch();

    setLoadStatus(
      'Загружаю список...',
      false
    );

    list.innerHTML = '';

    google.script.run
      .withSuccessHandler(
        function (result) {
          savedCharactersListIsAdmin =
            Boolean(
              result &&
              result.isAdmin
            );

          hiddenCharactersCount =
            Number(
              result &&
              result.hiddenCount
            ) || 0;

          characterDeletionPolicy = String(
            result && result.deletionPolicy || 'forbidden'
          );

          savedCharactersCache =
            result &&
            Array.isArray(
              result.characters
            )
              ? result.characters
              : [];

          hiddenSavedCharactersCache =
            result && Array.isArray(result.hiddenCharacters)
              ? result.hiddenCharacters
              : [];

          savedCharacterFoldersCache =
            result && Array.isArray(result.folders)
              ? result.folders
              : [];

          renderSavedCharactersList();
        }
      )
      .withFailureHandler(
        function (error) {
          savedCharactersCache = [];
          hiddenSavedCharactersCache = [];
          savedCharacterFoldersCache = [];

          setLoadStatus(
            error.message ||
              'Ошибка загрузки списка.',
            true
          );
        }
      )
      .mitriniumListVisibleCharacters();
  }

  function sanitizeLoadedCharacterCaps(
    character
  ) {
    const result =
      character || {};

    const loadedAttributes =
      result.attributes || {};

    Object.keys(
      loadedAttributes
    ).forEach(function (key) {
      loadedAttributes[key] =
        clampLoadedStat(
          loadedAttributes[key],
          1
        );
    });

    const loadedSkills =
      result.skills || {};

    Object.keys(
      loadedSkills
    ).forEach(function (groupKey) {
      const group =
        loadedSkills[groupKey] || {};

      Object.keys(group).forEach(
        function (skillKey) {
          group[skillKey] =
            clampLoadedStat(
              group[skillKey],
              0
            );
        }
      );
    });

    return result;
  }

  function clampLoadedStat(value, minimumValue) {
    const numericValue =
      Number(value);

    const minimum =
      Number(minimumValue) === 0
        ? 0
        : 1;

    if (!Number.isFinite(
      numericValue
    )) {
      return minimum;
    }

    return Math.max(
      minimum,
      Math.min(
        3,
        Math.round(numericValue)
      )
    );
  }

  function loadCharacterForEdit(
    characterId
  ) {
    setLoadStatus(
      'Загружаю персонажа...',
      false
    );

    google.script.run
      .withSuccessHandler(
        function (character) {
          const safeCharacter =
            sanitizeLoadedCharacterCaps(
              character
            );

          applyCharacterToForm(
            safeCharacter
          );

          syncClassIconPicker();

          if (
            typeof renderRollComponentOptions ===
            'function'
          ) {
            renderRollComponentOptions();
          }

          setLoadStatus(
            'Персонаж загружен для редактирования.',
            false
          );

          const characterCard =
            document
              .getElementById(
                'characterName'
              )
              ?.closest('.card');

          if (characterCard) {
            characterCard.scrollIntoView(
              {
                behavior: 'smooth',
                block: 'start'
              }
            );
          }
        }
      )
      .withFailureHandler(
        function (error) {
          setLoadStatus(
            error.message ||
              'Ошибка загрузки персонажа.',
            true
          );
        }
      )
      .loadCharacter(characterId);
  }

  function hideCharacterFromOwnerList(
    characterId
  ) {
    setLoadStatus(
      'Скрываю персонажа...',
      false
    );

    google.script.run
      .withSuccessHandler(
        function () {
          loadSavedCharactersList();
        }
      )
      .withFailureHandler(
        function (error) {
          setLoadStatus(
            error.message ||
              'Ошибка скрытия персонажа.',
            true
          );
        }
      )
      .mitriniumHideCharacter(
        characterId
      );
  }

  function restoreCharacterToOwnerList(characterId) {
    setLoadStatus('Возвращаю персонажа в ваш список...', false);

    google.script.run
      .withSuccessHandler(function () {
        loadSavedCharactersList();
      })
      .withFailureHandler(function (error) {
        setLoadStatus(error.message || 'Ошибка возврата персонажа.', true);
      })
      .mitriniumRestoreHiddenCharacter(characterId);
  }

  function deleteOwnCharacterFromList(characterId) {
    const keepsCopy = characterDeletionPolicy === 'archive';
    const confirmed = window.confirm(
      keepsCopy
        ? 'Удалить персонажа из вашего списка? Администратор сможет восстановить сохранённую копию.'
        : 'Окончательно удалить персонажа? Это действие нельзя отменить.'
    );
    if (!confirmed) return;
    setLoadStatus('Удаляю персонажа...', false);
    google.script.run
      .withSuccessHandler(function(result) {
        if (currentCharacterId === characterId) currentCharacterId = null;
        loadSavedCharactersList();
        setLoadStatus(result && result.archived
          ? 'Персонаж удалён из вашего списка; копия сохранена для администратора.'
          : 'Персонаж окончательно удалён.', false);
      })
      .withFailureHandler(function(error) {
        setLoadStatus(error.message || 'Ошибка удаления персонажа.', true);
      })
      .mitriniumDeleteOwnCharacter(characterId);
  }

  function restoreAllHiddenCharacters() {
    setLoadStatus(
      'Возвращаю скрытых персонажей...',
      false
    );

    google.script.run
      .withSuccessHandler(
        function () {
          loadSavedCharactersList();
        }
      )
      .withFailureHandler(
        function (error) {
          setLoadStatus(
            error.message ||
              'Ошибка возврата персонажей.',
            true
          );
        }
      )
      .mitriniumRestoreHiddenCharacters();
  }

  function renderHiddenCharactersControls() {
    const section =
      document.getElementById(
        'savedCharactersSection'
      );

    if (!section) {
      return;
    }

    let controls =
      section.querySelector(
        '.hidden-character-controls'
      );

    if (!controls) {
      controls =
        document.createElement('div');

      controls.className =
        'hidden-character-controls';

      const status =
        document.getElementById(
          'loadStatus'
        );

      if (status) {
        status.insertAdjacentElement(
          'beforebegin',
          controls
        );
      } else {
        section.appendChild(
          controls
        );
      }
    }

    controls.innerHTML = `
      <span class="hidden-character-count">
        Скрыто в моём списке:
        <strong>
          ${hiddenCharactersCount}
        </strong>
      </span>

      <label class="checkbox-line hidden-character-toggle">
        <input
          type="checkbox"
          ${showPersonallyHiddenCharacters ? 'checked' : ''}
          onchange="showPersonallyHiddenCharacters = this.checked; renderSavedCharactersList()"
        >
        <span>Показать скрытых</span>
      </label>

      <button
        type="button"
        class="secondary-button"
        ${
          hiddenCharactersCount === 0
            ? 'disabled'
            : ''
        }
        onclick="restoreAllHiddenCharacters()"
      >
        Вернуть всех скрытых
      </button>
    `;
  }

  function debugCharacters() {
    google.script.run
      .withSuccessHandler(
        function (result) {
          console.log(
            'DEBUG CHARACTERS:',
            result
          );

          alert(
            JSON.stringify(
              result,
              null,
              2
            )
          );
        }
      )
      .withFailureHandler(
        function (error) {
          alert(
            error.message ||
              'Ошибка debugCharacters'
          );
        }
      )
      .debugCharactersSheet();
  }
</script>
