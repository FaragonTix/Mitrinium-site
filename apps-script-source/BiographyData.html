  /**
   * Возвращает раздел биографических карточек по его идентификатору.
   *
   * Возможные значения:
   * origin
   * education
   * family
   */
  function getBiographySection(sectionId) {
    return biographyData.sections.find(function(section) {
      return section.id === sectionId;
    }) || null;
  }

  /**
   * Возвращает биографическую карточку.
   */
  function getBiographyCard(sectionId, cardId) {
    const section = getBiographySection(sectionId);

    if (!section) {
      return null;
    }

    return section.cards.find(function(card) {
      return card.id === cardId;
    }) || null;
  }

  /**
   * Возвращает все черты выбранной карточки.
   */
  function getBiographyTraits(sectionId, cardId) {
    const card = getBiographyCard(sectionId, cardId);

    if (!card || !Array.isArray(card.traits)) {
      return [];
    }

    return card.traits;
  }

  /**
   * Возвращает все шесть черт выбранной биографии.
   *
   * Ожидаемый формат biography:
   * {
   *   origin: {
   *     cardId: 'shelloun',
   *     detail: ''
   *   },
   *   education: {
   *     cardId: 'guild',
   *     detail: 'Часовое дело'
   *   },
   *   family: {
   *     cardId: 'working-income',
   *     detail: ''
   *   }
   * }
   */
  function getSelectedBiographyTraits(biography) {
    if (!biography || typeof biography !== 'object') {
      return [];
    }

    const result = [];

    biographyData.sections.forEach(function(section) {
      const selection = biography[section.id];

      if (!selection) {
        return;
      }

      const cardId = typeof selection === 'string'
        ? selection
        : selection.cardId;

      const card = getBiographyCard(section.id, cardId);

      if (!card) {
        return;
      }

      card.traits.forEach(function(trait) {
        result.push({
          id: trait.id,
          name: trait.name,
          description: trait.description,
          sectionId: section.id,
          sectionTitle: section.title,
          cardId: card.id,
          cardName: card.name
        });
      });
    });

    return result;
  }

  /**
   * Создаёт пустую структуру биографии для нового персонажа.
   */
  function createEmptyBiography() {
    return {
      origin: {
        cardId: '',
        detail: ''
      },
      education: {
        cardId: '',
        detail: ''
      },
      family: {
        cardId: '',
        detail: ''
      }
    };
  }

  /**
   * Приводит загруженную биографию к актуальному формату.
   * Поддерживает как новый формат с cardId,
   * так и упрощённый старый формат со строками.
   */
  function normalizeBiography(biography) {
    const normalized = createEmptyBiography();

    if (!biography || typeof biography !== 'object') {
      return normalized;
    }

    biographyData.sections.forEach(function(section) {
      const value = biography[section.id];

      if (typeof value === 'string') {
        normalized[section.id].cardId = value;
        return;
      }

      if (value && typeof value === 'object') {
        normalized[section.id].cardId = String(
          value.cardId || value.id || ''
        );

        normalized[section.id].detail = String(
          value.detail || ''
        );
      }
    });

    return normalized;
  }

  /**
   * Проверяет, что в каждом разделе выбрана существующая карточка
   * и заполнены обязательные уточнения.
   */
  function validateBiography(biography) {
    const normalized = normalizeBiography(biography);
    const errors = [];

    biographyData.sections.forEach(function(section) {
      const selection = normalized[section.id];
      const card = getBiographyCard(section.id, selection.cardId);

      if (!card) {
        errors.push(
          'Не выбрана карточка в разделе «' + section.title + '».'
        );
        return;
      }

      if (
        card.requiresDetail &&
        !String(selection.detail || '').trim()
      ) {
        errors.push(
          'Укажите уточнение для карточки «' +
          card.name +
          '» в разделе «' +
          section.title +
          '».'
        );
      }
    });

    return {
      valid: errors.length === 0,
      errors: errors,
      biography: normalized
    };
  }
