<style>
  :root {
    --page-bg: #181410;
    --panel-bg: #f4ead7;
    --panel-soft: #fff6e2;
    --panel-light: #fffaf0;
    --panel-accent: #fff0c8;
    --button-bg: #ead4aa;

    --border: #8a6638;
    --border-soft: #c7a873;
    --field-border: #9d7a4a;

    --text: #2a1b0f;
    --text-light: #f3dfb0;
    --success: #2f6f2f;
    --danger: #9b2f1f;

    --radius-small: 8px;
    --radius-medium: 12px;
    --radius-large: 16px;

    --shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    --content-width: 1040px;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    min-width: 320px;
    background: var(--page-bg);
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-width: 320px;
    min-height: 100vh;
    overflow-x: hidden;
    background: var(--page-bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-variant-numeric: tabular-nums;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  button,
  select,
  input[type="checkbox"] {
    touch-action: manipulation;
  }

  button {
    color: inherit;
    text-align: center;
    line-height: 1.2;
  }

  .hidden {
    display: none !important;
  }

  /* =========================
     Каркас приложения
  ========================= */

  .app-shell,
  .app {
    width: min(calc(100% - 32px), var(--content-width));
    margin: 0 auto;
    padding: 24px 0 48px;
  }

  .app-content,
  #editMode,
  #viewMode,
  .viewer,
  .viewer-content {
    width: 100%;
    min-width: 0;
  }

  #editMode,
  .viewer-content {
    display: grid;
    gap: 18px;
  }

  .hero {
    margin-bottom: 18px;
    text-align: center;
    color: var(--text-light);
  }

  .hero h1 {
    margin: 0;
    font-size: clamp(38px, 6vw, 58px);
    line-height: 1;
    letter-spacing: 2px;
  }

  .hero p {
    margin: 8px 0 0;
    font-size: clamp(17px, 2vw, 21px);
  }

  /* Переключатель специально не sticky:
     так он не создаёт невидимый слой над select на мобильных WebView. */
  .mode-switcher {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    gap: 10px;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto 20px;
    padding: 8px;
    border-radius: 999px;
    background: #211b16;
  }

  .mode-switcher button,
  .primary-button,
  .secondary-button,
  .equipment-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--button-bg);
    padding: 9px 16px;
    font-weight: bold;
    cursor: pointer;
  }

  .mode-switcher button.active {
    background: var(--panel-accent);
    box-shadow: 0 0 0 2px var(--border);
  }

  .card,
  .viewer-hero,
  .viewer-card {
    position: relative;
    min-width: 0;
    overflow: visible;
    border: 2px solid var(--border);
    border-radius: var(--radius-large);
    background: var(--panel-bg);
    box-shadow: var(--shadow);
  }

  .card {
    padding: clamp(16px, 2.4vw, 26px);
  }

  .viewer-hero,
  .viewer-card {
    padding: clamp(14px, 2vw, 20px);
  }

  h2,
  h3,
  h4,
  p,
  span,
  strong {
    overflow-wrap: anywhere;
  }

  h2 {
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .section-heading {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }

  .section-heading h2 {
    text-align: left;
  }

  .helper-note {
    max-width: 720px;
    margin: 6px 0 0;
    line-height: 1.4;
    opacity: 0.75;
  }

  .points-badge {
    flex: 0 0 auto;
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    background: var(--panel-light);
    padding: 8px 12px;
    white-space: nowrap;
  }

  /* =========================
     Формы
  ========================= */

  .form-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }

  .field,
  label {
    position: relative;
    display: block;
    min-width: 0;
    margin: 0;
    font-weight: bold;
  }

  .field-full {
    margin-top: 14px;
  }

  input,
  select,
  textarea {
    display: block;
    width: 100%;
    min-width: 0;
    margin-top: 6px;
    border: 1px solid var(--field-border);
    border-radius: var(--radius-small);
    background: var(--panel-light);
    color: var(--text);
    padding: 10px 12px;
  }

  input,
  select {
    min-height: 44px;
  }

  textarea {
    resize: vertical;
    line-height: 1.4;
  }

  /* Нативный select без кастомной стрелки и без наложений. */
  select {
    position: relative;
    z-index: 2;
    pointer-events: auto !important;
    cursor: pointer;
    appearance: auto;
    -webkit-appearance: menulist;
    -moz-appearance: menulist;
    background-image: none;
  }

  select,
  select option {
    color: var(--text);
    background: var(--panel-light);
  }

  input:focus,
  select:focus,
  textarea:focus,
  button:focus-visible,
  summary:focus-visible {
    outline: 3px solid rgba(138, 102, 56, 0.35);
    outline-offset: 2px;
  }

  .checkbox-line {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: bold;
    cursor: pointer;
  }

  .checkbox-line input {
    width: 20px;
    height: 20px;
    min-height: 0;
    margin: 0;
  }

  .name-generator {
    margin-top: 14px;
    border: 1px solid var(--field-border);
    border-radius: var(--radius-medium);
    background: var(--panel-soft);
  }

  .name-generator summary {
    padding: 12px 14px;
    font-weight: bold;
    cursor: pointer;
  }

  .name-generator[open] summary {
    border-bottom: 1px solid var(--border-soft);
  }

  .name-generator-body {
    display: grid;
    gap: 12px;
    padding: 14px;
  }

  .name-generator-body .helper-note {
    margin: 0;
  }

  .name-generator-controls {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .name-generator-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .name-generator-result {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-small);
    background: var(--panel-light);
    padding: 12px;
  }

  .name-generator-result[hidden] {
    display: none;
  }

  .name-generator-result > div {
    display: grid;
    gap: 4px;
    min-width: 0;
  }

  .name-generator-result-mode {
    opacity: 0.72;
    font-size: 12px;
  }

  .name-generator-result strong {
    overflow-wrap: anywhere;
    font-size: 18px;
  }

  /* =========================
     Атрибуты и ресурсы
  ========================= */

  .attributes-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
  }

  .attribute-item,
  .resource-card,
  .resource-item {
    min-width: 0;
    border: 1px solid var(--field-border);
    border-radius: var(--radius-medium);
    background: var(--panel-soft);
    padding: 14px;
    text-align: center;
  }

  .attribute-name,
  .resource-card span,
  .resource-name {
    display: block;
    margin-bottom: 10px;
    font-weight: bold;
    text-transform: uppercase;
  }

  .attribute-description {
    min-height: 3.4em;
    margin: -4px 0 12px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.3;
    text-transform: none;
  }

  .counter,
  .mini-counter {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .counter {
    gap: 12px;
  }

  .mini-counter {
    flex: 0 0 auto;
    gap: 6px;
  }

  .counter button,
  .mini-counter button,
  .viewer-state-value button,
  .viewer-money-controls button,
  .viewer-armor-buttons button {
    display: inline-grid;
    place-items: center;
    border: 1px solid var(--border);
    background: var(--button-bg);
    cursor: pointer;
  }

  .counter button {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 21px;
  }

  .mini-counter button {
    width: 30px;
    height: 30px;
    border-radius: 50%;
  }

  .counter strong {
    min-width: 26px;
    font-size: 22px;
  }

  .mini-counter strong {
    min-width: 18px;
    text-align: center;
  }

  .resources-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
  }

  .resource-card strong,
  .resource-value {
    display: block;
    font-size: clamp(30px, 4vw, 38px);
  }

  .resource-note {
    margin-top: 8px;
    font-size: 13px;
    opacity: 0.75;
  }

  /* =========================
     Навыки
  ========================= */

  .skill-recommendation-toggle {
    width: fit-content;
    margin: 0 0 14px;
  }

  .skills-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(150px, 1fr));
    gap: 12px;
  }

  .skill-column {
    display: grid;
    grid-template-rows: auto repeat(6, 62px);
    align-content: start;
    gap: 10px;
    min-width: 0;
    border: 1px solid var(--field-border);
    border-radius: var(--radius-medium);
    background: var(--panel-soft);
    padding: 12px;
  }

  .skills-grid[data-skill-type-filter='primary'] .skill-column {
    grid-template-rows: auto repeat(4, 62px);
  }

  .skills-grid[data-skill-type-filter='secondary'] .skill-column {
    grid-template-rows: auto repeat(2, 62px);
  }

  .skill-column h3 {
    margin: 0;
    border-bottom: 1px solid var(--border-soft);
    padding-bottom: 8px;
    text-align: center;
    text-transform: uppercase;
    font-size: 15px;
  }

  .skill-item {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-width: 0;
    height: 62px;
    margin-right: -6px;
    margin-left: -6px;
    margin-bottom: 0;
    border: 1px solid transparent;
    border-radius: 9px;
    padding: 6px;
    font-size: 14px;
  }

  .skill-item:last-child {
    margin-bottom: 0;
  }

  .skill-item > span {
    min-width: 0;
    line-height: 1.2;
  }

  .skill-item.recommended-primary {
    border-color: #b8872f;
    background: #f2d99f;
  }

  .skill-item.recommended-secondary {
    border-color: #8b929b;
    background: linear-gradient(135deg, #e7e8e8, #c8cbd0);
  }

  .skill-item.secondary-skill {
    border-color: #a4a8ae;
    background: linear-gradient(135deg, #f4f1e9, #e2e3e5);
  }

  .skill-item.recommended-primary.secondary-skill {
    border-color: #b8872f;
    background: linear-gradient(135deg, #f2d99f 0 76%, #d8dade 76% 100%);
  }

  .skill-item.useful-skill {
    box-shadow: inset 3px 0 #668b85;
  }

  .skill-sticky-controls {
    margin-bottom: 14px;
  }

  .skill-mobile-progress {
    display: none;
  }

  .skill-type-filters {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .skill-type-filters button {
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    background: var(--panel-light);
    padding: 7px 12px;
    color: inherit;
    cursor: pointer;
  }

  .skill-type-filters button:hover,
  .skill-type-filters button.active {
    border-color: #88714d;
    background: #e7dbc3;
  }

  .skill-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
  .skill-recommendation-toggle { margin-right: auto; }
  .skill-mark-legend { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #59606a; }
  .skill-mark-legend[hidden] { display: none; }
  .skill-mark-legend i,
  .skill-marks i { width: 9px; height: 9px; border: 1px solid; border-radius: 50%; }
  .skill-mark-legend.secondary i,
  .skill-marks i.secondary { border-color: #7f8790; background: #cfd2d6; }
  .skill-mark-legend.useful i,
  .skill-marks i.useful { border-color: #4f7771; background: #86aaa4; }
  .skill-mark-legend.recommended i,
  .skill-marks i.recommended { border-color: #9b6d1e; background: #d5a94d; }

  .skill-name {
    display: flex;
    align-items: center;
    gap: 5px;
    width: 100%;
    height: 100%;
    min-width: 0;
    max-width: 100%;
    overflow-wrap: normal;
    word-break: normal;
  }

  .skill-name-text {
    min-width: 0;
    overflow-wrap: normal;
    word-break: normal;
    white-space: normal;
    -webkit-hyphens: auto;
    hyphens: auto;
  }

  .skill-marks {
    position: absolute;
    top: 3px;
    right: 4px;
    display: inline-flex;
    gap: 3px;
  }

  #secondarySkillPointsProgress {
    display: block;
    margin-top: 2px;
    color: #8b2e27;
    font-size: 11px;
  }

  #secondarySkillPointsProgress.complete { color: #43603e; }

  .skill-item .mini-counter {
    gap: 3px;
  }

  .skill-item .mini-counter button {
    width: 26px;
    height: 26px;
  }

  .skill-item .mini-counter strong {
    min-width: 14px;
  }

  .skill-info summary {
    display: flex;
    align-items: center;
    width: 100%;
    height: 100%;
    cursor: help;
    list-style: none;
  }

  .skill-info summary::-webkit-details-marker { display: none; }

  .skill-info summary::after {
    content: none;
  }

  .skill-info summary:hover .skill-name-text,
  .skill-info summary:focus-visible .skill-name-text {
    text-decoration: underline dotted;
    text-underline-offset: 3px;
  }

  .skill-info p {
    position: absolute;
    z-index: 12;
    width: min(300px, calc(100vw - 48px));
    margin: 7px 0 0;
    border: 1px solid var(--border);
    border-radius: var(--radius-small);
    background: var(--panel-light);
    box-shadow: 0 7px 20px rgba(63, 39, 13, 0.22);
    padding: 9px 11px;
    font-size: 13px;
    font-weight: normal;
    line-height: 1.35;
  }

  /* =========================
     Способности
  ========================= */

  .abilities-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(300px, 0.9fr);
    gap: 18px;
    align-items: start;
  }

  .abilities-list {
    display: grid;
    gap: 14px;
    min-width: 0;
  }

  .ability-category {
    min-width: 0;
    border: 1px solid var(--field-border);
    border-radius: var(--radius-medium);
    background: var(--panel-soft);
    padding: 12px;
  }

  .ability-category h4 {
    margin: 0 0 10px;
    border-bottom: 1px solid var(--border-soft);
    padding-bottom: 8px;
    text-align: center;
    text-transform: uppercase;
  }

  .ability-list-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 42px;
    gap: 8px;
    align-items: stretch;
    min-width: 0;
    margin-bottom: 8px;
    border: 1px solid #d1b982;
    border-radius: var(--radius-small);
    background: var(--panel-light);
    padding: 8px;
  }

  .ability-list-item:last-child {
    margin-bottom: 0;
  }

  .ability-list-item.selected {
    border-color: var(--border);
    background: var(--panel-accent);
  }

  .ability-list-item.active {
    box-shadow: 0 0 0 2px var(--border);
  }

  .ability-title-button {
    min-width: 0;
    border: 0;
    background: transparent;
    padding: 2px;
    text-align: left;
    cursor: pointer;
  }

  .ability-title-button span,
  .ability-title-button small {
    display: block;
    min-width: 0;
  }

  .ability-title-button span {
    margin-bottom: 4px;
    font-weight: bold;
    line-height: 1.2;
  }

  .ability-title-button small {
    line-height: 1.25;
    opacity: 0.75;
  }

  .ability-pick-button,
  .equipment-icon-button {
    display: grid;
    place-items: center;
    align-self: stretch;
    width: 42px;
    min-width: 42px;
    min-height: 42px;
    border: 1px solid var(--border);
    border-radius: var(--radius-small);
    background: var(--button-bg);
    padding: 0;
    font-size: 24px;
    font-weight: bold;
    line-height: 1;
    cursor: pointer;
  }

  .ability-details-panel {
    position: sticky;
    top: 12px;
    min-width: 0;
    min-height: 220px;
    border: 1px solid var(--field-border);
    border-radius: var(--radius-medium);
    background: var(--panel-soft);
    padding: 16px;
    line-height: 1.45;
  }

  .ability-detail-title {
    margin-bottom: 6px;
    font-size: 22px;
    font-weight: bold;
  }

  .ability-detail-meta {
    margin-bottom: 14px;
    opacity: 0.75;
  }

  .ability-description-block {
    margin-bottom: 12px;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-small);
    background: var(--panel-light);
    padding: 12px 14px;
    overflow-wrap: break-word;
  }

  .ability-description-row strong {
    display: inline;
  }

  .ability-description-row p {
    display: inline;
    margin: 0 0 0 0.35em;
  }

  .ability-description-row + .ability-description-row {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border-soft);
  }

  /* =========================
     Снаряжение
  ========================= */

  .equipment-summary {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin: 18px 0;
  }

  .equipment-summary > div {
    min-width: 0;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-small);
    background: var(--panel-light);
    padding: 10px;
    text-align: center;
  }

  .equipment-section {
    margin-top: 22px;
  }

  .equipment-section h3,
  .subsection-title {
    margin: 0 0 12px;
    border-bottom: 1px solid var(--border-soft);
    padding-bottom: 8px;
    text-align: center;
    text-transform: uppercase;
    font-size: 16px;
  }

  .equipment-collapsible > summary {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-small);
    background: var(--panel-light);
    padding: 10px 12px;
    cursor: pointer;
    list-style: none;
  }

  .equipment-collapsible > summary::-webkit-details-marker {
    display: none;
  }

  .equipment-collapsible > summary h3 {
    flex: 1;
    margin: 0;
    border: 0;
    padding: 0;
    text-align: left;
  }

  .equipment-collapsible > summary::after {
    content: 'Показать';
    color: var(--muted);
    font-size: 13px;
    text-transform: none;
  }

  .equipment-collapsible[open] > summary {
    margin-bottom: 12px;
  }

  .equipment-collapsible[open] > summary::after {
    content: 'Скрыть';
  }

  .equipment-list {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }

  .equipment-card {
    min-width: 0;
    border: 1px solid var(--field-border);
    border-radius: var(--radius-medium);
    background: var(--panel-soft);
    padding: 12px;
  }

  .equipment-card.recommended {
    border-width: 2px;
    background: var(--panel-accent);
  }

  .equipment-card-main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 42px;
    gap: 10px;
    align-items: start;
    min-width: 0;
  }

  .equipment-card-main > div {
    min-width: 0;
  }

  .equipment-name,
  .selected-equipment-name {
    margin-bottom: 4px;
    font-weight: bold;
    line-height: 1.15;
  }

  .equipment-meta {
    margin-bottom: 6px;
    font-size: 13px;
    opacity: 0.8;
  }

  .equipment-quick-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 8px;
  }

  .equipment-quick-stat {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    border: 1px solid #ad7c30;
    border-radius: 999px;
    background: #fff1cf;
    padding: 3px 8px;
    line-height: 1.1;
  }

  .equipment-quick-stat small {
    color: #785b2e;
    font-size: 11px;
  }

  .equipment-quick-stat strong {
    color: #39250f;
    font-size: 14px;
  }

  .equipment-details,
  .selected-equipment-details {
    font-size: 13px;
    line-height: 1.35;
  }

  .selected-equipment-details {
    opacity: 0.8;
  }

  #selectedEquipmentList,
  .selected-equipment-list {
    display: grid;
    gap: 8px;
  }

  .selected-equipment-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto 34px;
    gap: 10px;
    align-items: center;
    min-width: 0;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-small);
    background: var(--panel-light);
    padding: 9px 10px;
  }

  .selected-equipment-item button {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--button-bg);
    cursor: pointer;
  }

  /* =========================
     Действия и статусы
  ========================= */

  .action-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .primary-button {
    background: #dfc184;
  }

  .save-status {
    min-height: 22px;
    margin: 12px 0 0;
    text-align: center;
    font-weight: bold;
  }

  .save-status.success {
    color: var(--success);
  }

  .save-status.error {
    color: var(--danger);
  }

  .empty-note {
    margin: 10px 0;
    text-align: center;
    opacity: 0.7;
  }

  /* =========================
     Сохранённые персонажи
  ========================= */

  .saved-characters-list {
    display: grid;
    gap: 10px;
    margin-top: 16px;
  }

  .saved-character-item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
    min-width: 0;
    border: 1px solid var(--field-border);
    border-radius: var(--radius-medium);
    background: var(--panel-soft);
    padding: 12px;
  }

  .equipment-budget-sticky {
    position: sticky;
    top: 8px;
    z-index: 8;
    display: flex;
    justify-content: center;
    gap: 0.4em;
    width: fit-content;
    margin: 0 0 12px auto;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel-light);
    box-shadow: 0 3px 10px rgba(63, 39, 13, 0.16);
    padding: 7px 13px;
  }

  .saved-character-item.personally-hidden {
    opacity: 0.68;
    border-style: dashed;
  }

  .saved-character-name {
    margin-bottom: 4px;
    font-weight: bold;
  }

  .saved-character-meta {
    font-size: 13px;
    opacity: 0.75;
  }

  .saved-character-folder {
    min-width: 0;
    border: 1px solid var(--field-border);
    border-radius: var(--radius-medium);
    background: var(--panel-light);
    overflow: hidden;
  }

  .saved-character-folder > summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 14px;
    background: var(--button-bg);
    font-weight: 750;
    cursor: pointer;
  }

  .saved-character-folder > summary strong {
    min-width: 28px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--panel-light);
    padding: 2px 8px;
    text-align: center;
  }

  .saved-character-folder-list {
    display: grid;
    gap: 8px;
    padding: 10px;
  }

  /* =========================
     Просмотрщик
  ========================= */

  .viewer {
    max-width: 920px;
    margin: 0 auto;
  }

  .viewer-hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .viewer-hero h2 {
    text-align: left;
  }

  .viewer-hero p {
    margin: 4px 0 0;
    opacity: 0.8;
  }

  .viewer-card h3 {
    margin: 0 0 12px;
    border-bottom: 1px solid var(--border-soft);
    padding-bottom: 8px;
    text-align: left;
    text-transform: uppercase;
  }

  .viewer-grid,
  .viewer-state-grid,
  .viewer-money-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }

  .viewer-stat,
  .viewer-state-counter,
  .viewer-money-counter {
    min-width: 0;
    border: 1px solid var(--field-border);
    border-radius: var(--radius-medium);
    background: var(--panel-soft);
    padding: 12px;
    text-align: center;
  }

  .viewer-stat span,
  .viewer-state-label {
    display: block;
    margin-bottom: 10px;
    font-size: 13px;
    font-weight: bold;
    text-transform: uppercase;
    opacity: 0.8;
  }

  .viewer-stat strong {
    display: block;
    margin-top: 6px;
    font-size: 32px;
  }

  .viewer-state-value {
    display: grid;
    grid-template-columns: 40px 36px minmax(60px, 84px) auto 36px;
    gap: 6px;
    align-items: center;
    justify-content: center;
  }

  .viewer-state-static-value {
    min-height: 36px;
    display: grid;
    place-items: center;
    font-size: 30px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .viewer-money-controls {
    display: grid;
    grid-template-columns: 44px 36px minmax(70px, 90px) 36px 44px;
    gap: 6px;
    align-items: center;
    justify-content: center;
  }

  .viewer-state-value button,
  .viewer-money-controls button {
    min-width: 0;
    height: 36px;
    border-radius: 999px;
    padding: 0 5px;
  }

  .viewer-state-value input,
  .viewer-money-controls input {
    width: 100%;
    min-width: 0;
    min-height: 36px;
    margin: 0;
    padding: 6px;
    text-align: center;
  }

  .viewer-notes {
    min-height: 130px;
  }

  .viewer-skill-group {
    margin-bottom: 12px;
  }

  .viewer-skill-group h4,
  .viewer-subgroup h4 {
    margin: 8px 0;
    text-transform: uppercase;
  }

  .viewer-skill-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .viewer-skill-list span {
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    background: var(--panel-light);
    padding: 6px 10px;
    font-size: 14px;
  }

  .viewer-equipment-item,
  .viewer-ability {
    min-width: 0;
    margin-bottom: 8px;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-medium);
    background: var(--panel-light);
    padding: 10px;
  }

  .viewer-equipment-item {
    display: grid;
    gap: 4px;
  }

  .viewer-equipment-item span {
    font-size: 13px;
    line-height: 1.35;
    opacity: 0.85;
  }

  .viewer-equipment-condition {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    border-top: 1px solid var(--border-soft);
    padding-top: 8px;
  }

  .viewer-equipment-condition > strong {
    min-width: 82px;
    font-size: 13px;
  }

  .viewer-equipment-condition button {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--button-bg);
  }

  .viewer-equipment-condition input {
    width: 54px;
    height: 30px;
    padding: 3px 5px;
    text-align: center;
  }

  .viewer input[type='number'] {
    appearance: textfield;
    -moz-appearance: textfield;
  }

  .viewer input[type='number']::-webkit-inner-spin-button,
  .viewer input[type='number']::-webkit-outer-spin-button {
    margin: 0;
    -webkit-appearance: none;
  }

  .viewer-equipment-limit {
    font-size: 12px;
    opacity: 0.75;
  }

  .viewer-ability summary {
    cursor: pointer;
  }

  .viewer-ability-groups {
    display: grid;
    gap: 16px;
  }

  .viewer-ability-group {
    min-width: 0;
  }

  .viewer-ability-group h4 {
    margin: 0 0 8px;
    border-bottom: 1px solid var(--border-soft);
    padding-bottom: 6px;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .viewer-ability-group-list {
    display: grid;
    gap: 8px;
  }

  .viewer-ability-item {
    min-width: 0;
  }

  .viewer-ability-group-list .viewer-ability {
    margin-bottom: 0;
  }

  .viewer-ability-uses {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin: -1px 10px 0;
    border: 1px solid var(--border-soft);
    border-top: 0;
    border-radius: 0 0 var(--radius-medium) var(--radius-medium);
    background: var(--panel-soft);
    padding: 7px 10px;
  }

  .viewer-ability-uses > strong {
    margin-right: auto;
    font-size: 13px;
  }

  .viewer-ability-uses button {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--button-bg);
  }

  .viewer-ability-uses input {
    width: 48px;
    height: 30px;
    padding: 3px 5px;
    text-align: center;
  }

  .viewer-ability-uses-limit {
    font-size: 12px;
    opacity: 0.75;
  }

  .viewer-ability summary strong {
    display: block;
    margin-bottom: 4px;
  }

  .viewer-ability summary span {
    font-size: 13px;
    opacity: 0.75;
  }

  .viewer-ability p {
    margin: 4px 0 0;
    line-height: 1.35;
  }

  .viewer-ability-description-block {
    margin-top: 8px;
    background: var(--panel-soft);
  }

  .viewer-ability .ability-description-row p {
    margin: 0 0 0 0.35em;
  }

  .viewer-maintenance-summary {
    margin-bottom: 12px;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-small);
    background: var(--panel-light);
    padding: 10px;
    text-align: center;
    font-weight: bold;
  }

  /* Броня */

  .viewer-armor-values {
    display: grid;
    grid-template-columns: minmax(60px, 1fr) auto minmax(60px, 1fr);
    gap: 8px;
    align-items: end;
  }

  .viewer-armor-values label {
    min-width: 0;
    text-align: center;
    font-size: 12px;
  }

  .viewer-armor-values label span {
    display: block;
    margin-bottom: 4px;
  }

  .viewer-armor-values input {
    width: 100%;
    min-width: 0;
    margin: 0;
    text-align: center;
  }

  .viewer-armor-divider {
    padding-bottom: 9px;
    font-size: 22px;
    font-weight: bold;
  }

  .viewer-armor-buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
  }

  .viewer-armor-buttons button {
    width: 38px;
    height: 38px;
    border-radius: 50%;
  }

  /* =========================
     Планшеты
  ========================= */

  @media (max-width: 980px) {
    .skills-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .equipment-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .abilities-layout {
      grid-template-columns: minmax(0, 1fr);
    }

    .ability-details-panel {
      position: static;
      min-height: 0;
    }
  }

  /* =========================
     Телефоны
  ========================= */

  @media (max-width: 700px) {
    .app-shell,
    .app {
      width: min(calc(100% - 20px), var(--content-width));
      padding-top: 14px;
    }

    #editMode,
    .viewer-content {
      gap: 12px;
    }

    .card {
      padding: 15px;
      border-radius: var(--radius-medium);
    }

    /* Убираем любые потенциальные перекрытия на телефоне. */
    .mode-switcher {
      position: relative;
      top: auto;
      z-index: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      width: 100%;
      border-radius: var(--radius-medium);
    }

    .ability-details-panel {
      display: none;
    }

    .mode-switcher button {
      flex: 1 1 0;
      min-width: 0;
      padding-inline: 10px;
    }

    .control-methods-editor,
    .viewer-control-grid {
      grid-template-columns: minmax(0, 1fr);
    }

    .control-method-editor-row {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .control-method-editor-row > strong {
      grid-column: 1 / -1;
    }

    .section-heading {
      display: grid;
      gap: 10px;
    }

    .section-heading .secondary-button,
    .points-badge {
      justify-self: stretch;
      width: 100%;
      text-align: center;
    }

    .skill-heading-points {
      display: none;
    }

    .skill-sticky-controls {
      position: sticky;
      top: 6px;
      z-index: 20;
      display: grid;
      gap: 8px;
      margin: 0 -7px 14px;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-small);
      background: rgba(244, 234, 215, 0.96);
      box-shadow: 0 5px 14px rgba(63, 39, 13, 0.14);
      padding: 9px;
      backdrop-filter: blur(6px);
    }

    .skill-mobile-progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .skill-mobile-progress small {
      color: var(--muted);
      text-align: right;
      line-height: 1.2;
    }

    .skill-type-filters {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .skill-type-filters button {
      min-width: 0;
      padding: 7px 5px;
    }

    .form-grid,
    .name-generator-controls,
    .attributes-grid,
    .resources-grid,
    .skills-grid,
    .equipment-list,
    .equipment-summary,
    .viewer-grid,
    .viewer-state-grid,
    .viewer-money-grid {
      grid-template-columns: minmax(0, 1fr);
    }

    .name-generator-actions,
    .name-generator-result {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }

    .name-generator-actions button,
    .name-generator-result button {
      width: 100%;
    }

    /* iOS не увеличивает страницу при выборе и оставляет нативный picker. */
    input,
    select,
    textarea {
      font-size: 16px;
    }

    select {
      position: relative;
      z-index: 10;
      min-height: 50px;
      pointer-events: auto !important;
      touch-action: manipulation;
      appearance: auto !important;
      -webkit-appearance: menulist !important;
    }

    .field:has(select) {
      z-index: 10;
    }

    .viewer-hero {
      display: grid;
    }

    .viewer-hero .equipment-button,
    .action-row button,
    .saved-character-item .equipment-button {
      width: 100%;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr;
    }

    .saved-character-item {
      grid-template-columns: minmax(0, 1fr);
    }
  }

  @media (max-width: 460px) {
    .hero h1 {
      font-size: 38px;
    }

    .equipment-card-main,
    .ability-list-item {
      grid-template-columns: minmax(0, 1fr) 40px;
    }

    .equipment-icon-button,
    .ability-pick-button {
      width: 40px;
      min-width: 40px;
      height: 40px;
      min-height: 40px;
    }

    .selected-equipment-item {
      grid-template-columns: minmax(0, 1fr) 32px;
    }

    .selected-equipment-item > strong {
      grid-column: 1 / -1;
      grid-row: 2;
    }

    .selected-equipment-item button {
      grid-column: 2;
      grid-row: 1;
    }

    .viewer-state-value {
      grid-template-columns: 38px 34px minmax(56px, 74px) auto 34px;
      gap: 4px;
    }

    .viewer-money-controls {
      grid-template-columns: 40px 34px minmax(60px, 74px) 34px 40px;
      gap: 4px;
    }

    .viewer-state-value button,
    .viewer-money-controls button {
      padding-inline: 2px;
      font-size: 13px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      scroll-behavior: auto !important;
      transition: none !important;
    }
  }
  .viewer-skills-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

========================= */

}
