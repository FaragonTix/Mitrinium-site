<script>
  const rulesReferenceScenes = {
    hindrance: ['3d4', '3 Куба сцены 3d4'],
    normal: ['d4 + d6 + d8', 'Кубы сцены d4 + d6 + d8'],
    advantage: ['3d8', '3 Куба сцены 3d8']
  };

  let rulesReferenceTopic = 'all';
  let rulesReferenceScene = 'normal';

  function clampRulesReferenceValue(value, minimum, maximum) {
    const parsed = Number.parseInt(value, 10);
    if (!Number.isFinite(parsed)) return minimum;
    return Math.max(minimum, Math.min(maximum, parsed));
  }

  function initializeRulesReference() {
    updateRulesReferencePool();
    initializeRulesReferenceAbilityDirectory();
    filterRulesReference();
  }

  function setRulesReferenceScene(scene) {
    if (!rulesReferenceScenes[scene]) return;
    rulesReferenceScene = scene;
    document.querySelectorAll('[data-reference-scene]').forEach(function (button) {
      const active = button.dataset.referenceScene === scene;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    updateRulesReferencePool();
  }

  function updateRulesReferencePool() {
    const attributeInput = document.getElementById('referenceAttributeDice');
    const skillInput = document.getElementById('referenceSkillDice');
    const output = document.getElementById('referencePoolOutput');
    if (!attributeInput || !skillInput || !output) return;

    const attribute = clampRulesReferenceValue(attributeInput.value, 1, 3);
    const skill = clampRulesReferenceValue(skillInput.value, 0, 3);
    attributeInput.value = attribute;
    skillInput.value = skill;

    const characterDice = attribute + skill;
    const scene = rulesReferenceScenes[rulesReferenceScene] || rulesReferenceScenes.normal;
    const pool = rulesReferenceScene === 'normal'
      ? 'd4 + ' + (characterDice + 1) + 'd6 + d8'
      : scene[0] + ' + ' + characterDice + 'd6';

    output.innerHTML = '<span>Ваш пул</span><strong>' + pool + '</strong><small>' + scene[1] + ' + ' + characterDice + 'd6 персонажа</small>';
  }

  function normalizeRulesReferenceText(value) {
    return String(value || '')
      .toLocaleLowerCase('ru-RU')
      .replace(/ё/g, 'е')
      .replace(/[^a-zа-я0-9]+/gi, ' ')
      .trim();
  }

  function setRulesReferenceTopic(topic) {
    rulesReferenceTopic = topic || 'all';
    document.querySelectorAll('[data-reference-topic]').forEach(function (button) {
      const active = button.dataset.referenceTopic === rulesReferenceTopic;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', active ? 'true' : 'false');
    });
    filterRulesReference();
  }

  function filterRulesReference() {
    const input = document.getElementById('referenceSearch');
    const status = document.getElementById('referenceResultStatus');
    const emptyState = document.getElementById('referenceEmptyState');
    const query = normalizeRulesReferenceText(input ? input.value : '');
    const cards = Array.from(document.querySelectorAll('[data-reference-card]'));
    let visibleCount = 0;

    cards.forEach(function (card) {
      const topics = String(card.dataset.referenceTopics || '').split(/\s+/);
      const matchesTopic = rulesReferenceTopic === 'all' || topics.includes(rulesReferenceTopic);
      const matchesSearch = !query || normalizeRulesReferenceText(card.textContent).includes(query);
      const visible = matchesTopic && matchesSearch;
      card.hidden = !visible;
      if (visible) visibleCount += 1;
    });

    if (emptyState) emptyState.hidden = visibleCount > 0;
    if (status) {
      status.textContent = !query && rulesReferenceTopic === 'all'
        ? 'Показаны все разделы'
        : (visibleCount ? 'Найдено разделов: ' + visibleCount : 'Совпадений нет');
    }
  }

  function clearRulesReferenceSearch() {
    const input = document.getElementById('referenceSearch');
    if (!input) return;
    input.value = '';
    input.focus();
    filterRulesReference();
  }

  function resetRulesReferenceFilters() {
    const input = document.getElementById('referenceSearch');
    if (input) input.value = '';
    setRulesReferenceTopic('all');
  }

  function escapeRulesReferenceHtml(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function initializeRulesReferenceAbilityDirectory() {
    const classSelect = document.getElementById('referenceAbilityClass');
    const categorySelect = document.getElementById('referenceAbilityCategory');
    if (!classSelect || !categorySelect || typeof abilityData === 'undefined') return;

    const classes = Array.from(new Set(abilityData.map(function (ability) {
      return ability.className;
    })));

    classSelect.innerHTML = '<option value="all">Все классы</option>' + classes
      .map(function (className) {
        return '<option value="' + escapeRulesReferenceHtml(className) + '">' + escapeRulesReferenceHtml(className) + '</option>';
      })
      .join('');

    categorySelect.innerHTML = '<option value="all">Все категории</option>' + Object.entries(abilityCategoryLabels || {})
      .map(function (entry) {
        return '<option value="' + escapeRulesReferenceHtml(entry[0]) + '">' + escapeRulesReferenceHtml(entry[1]) + '</option>';
      })
      .join('');

    filterRulesReferenceAbilities();
  }

  function getRulesReferenceAbilitySearchText(ability) {
    return normalizeRulesReferenceText([
      ability.name,
      ability.className,
      ability.type,
      ability.pool,
      ability.effect,
      ability.breakthrough,
      ability.complications,
      ability.control,
      ability.prerequisite,
      ability.reaction
    ].filter(Boolean).join(' '));
  }

  function renderRulesReferenceAbilityFact(label, value) {
    if (value === null || value === undefined || value === '') return '';
    return '<p><strong>' + escapeRulesReferenceHtml(label) + ':</strong> ' + escapeRulesReferenceHtml(value) + '</p>';
  }

  function renderRulesReferenceAbility(ability) {
    const categoryLabel = abilityCategoryLabels[ability.category] || ability.category;
    return '<details>' +
      '<summary><span class="reference-ability-name">' + escapeRulesReferenceHtml(ability.name) + '</span>' +
      '<span class="reference-ability-category">' + escapeRulesReferenceHtml(categoryLabel) + '</span></summary>' +
      '<div class="reference-ability-body">' +
      renderRulesReferenceAbilityFact('Тип', ability.type) +
      renderRulesReferenceAbilityFact('Пул', ability.pool) +
      renderRulesReferenceAbilityFact('Эффект', ability.effect) +
      renderRulesReferenceAbilityFact('Прорыв', ability.breakthrough) +
      renderRulesReferenceAbilityFact('Осложнение', ability.complications) +
      renderRulesReferenceAbilityFact('Контроль', ability.control) +
      renderRulesReferenceAbilityFact('Требование', ability.prerequisite) +
      renderRulesReferenceAbilityFact('Применений', ability.charges) +
      renderRulesReferenceAbilityFact('Реакция', ability.reaction) +
      '</div></details>';
  }

  function filterRulesReferenceAbilities() {
    const results = document.getElementById('referenceAbilityResults');
    const status = document.getElementById('referenceAbilityStatus');
    if (!results || typeof abilityData === 'undefined') return;

    const query = normalizeRulesReferenceText(document.getElementById('referenceAbilitySearch')?.value || '');
    const queryParts = query ? query.split(/\s+/) : [];
    const selectedClass = document.getElementById('referenceAbilityClass')?.value || 'all';
    const selectedCategory = document.getElementById('referenceAbilityCategory')?.value || 'all';
    const filtered = abilityData.filter(function (ability) {
      const searchText = getRulesReferenceAbilitySearchText(ability);
      const matchesQuery = queryParts.every(function (part) { return searchText.includes(part); });
      return matchesQuery &&
        (selectedClass === 'all' || ability.className === selectedClass) &&
        (selectedCategory === 'all' || ability.category === selectedCategory);
    });

    const categoryOrder = ['ultimate', 'favorite', 'common', 'situational'];
    const classOrder = Array.from(new Set(abilityData.map(function (ability) { return ability.className; })));
    results.innerHTML = classOrder.map(function (className) {
      const classAbilities = filtered
        .filter(function (ability) { return ability.className === className; })
        .sort(function (left, right) {
          return categoryOrder.indexOf(left.category) - categoryOrder.indexOf(right.category);
        });
      if (!classAbilities.length) return '';
      return '<section class="reference-ability-class">' +
        '<header><h3>' + escapeRulesReferenceHtml(className) + '</h3><span>' + classAbilities.length + '</span></header>' +
        '<div class="reference-ability-grid">' + classAbilities.map(renderRulesReferenceAbility).join('') + '</div>' +
        '</section>';
    }).join('');

    if (!filtered.length) {
      results.innerHTML = '<div class="reference-ability-empty"><strong>Способности не найдены</strong><p>Измените запрос или сбросьте фильтры.</p></div>';
    }
    if (status) status.textContent = 'Найдено способностей: ' + filtered.length + ' из ' + abilityData.length;
  }

  function resetRulesReferenceAbilityFilters() {
    const search = document.getElementById('referenceAbilitySearch');
    const classSelect = document.getElementById('referenceAbilityClass');
    const categorySelect = document.getElementById('referenceAbilityCategory');
    if (search) search.value = '';
    if (classSelect) classSelect.value = 'all';
    if (categorySelect) categorySelect.value = 'all';
    filterRulesReferenceAbilities();
    if (search) search.focus();
  }
</script>
