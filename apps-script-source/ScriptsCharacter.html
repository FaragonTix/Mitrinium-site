<script>
  // Атрибуты, навыки, ресурсы, биография, форма персонажа и клиентская проверка.

  let currentBiography = createEmptyBiography();

  /* =========================
     Атрибуты
  ========================= */

  function getSpentAttributePoints() {
    return Object.values(attributes).reduce(function(sum, attribute) {
      return sum + (attribute.value - 1);
    }, 0);
  }

  function getAttributePointsLeft() {
    return totalExtraAttributePoints - getSpentAttributePoints();
  }

  function changeAttribute(attributeKey, delta) {
    const attribute = attributes[attributeKey];
    if (!attribute) return;
    const nextValue = Number(attribute.value) + Number(delta);
    if (nextValue < 1 || nextValue > 3) return;
    if (!advancedEditMode && delta > 0 && getAttributePointsLeft() <= 0) return;
    attribute.value = nextValue;
    renderAttributes();
    refreshViewerIfOpen();
    if (typeof renderRollComponentOptions === 'function') renderRollComponentOptions();
  }

  function renderAttributes() {
    const grid = document.getElementById('attributesGrid');
    const pointsLeft = document.getElementById('attributePointsLeft');

    if (!grid || !pointsLeft) return;

    pointsLeft.textContent = advancedEditMode
      ? 'режим развития'
      : getAttributePointsLeft();

    grid.innerHTML = '';

    Object.entries(attributes).forEach(function(entry) {
      const key = entry[0];
      const attribute = entry[1];
      const item = document.createElement('div');

      item.className = 'attribute-item';
      item.innerHTML = `
        <div class="attribute-name">${attribute.name}</div>
        <div class="attribute-description">${attribute.description || ''}</div>

        <div class="counter">
          <button
            type="button"
            onclick="changeAttribute('${key}', -1)"
          >
            −
          </button>

          <strong>${attribute.value}</strong>

          <button
            type="button"
            onclick="changeAttribute('${key}', 1)"
          >
            +
          </button>
        </div>
      `;

      grid.appendChild(item);
    });

    renderResources();
  }

  /* =========================
     Ресурсы
  ========================= */

  function getCalculatedResources() {
    return {
      body: 4 + (
        attributes.napor.value +
        attributes.snorovka.value
      ) * 2,

      mainNerve:
        attributes.gospodstvo.value +
        attributes.nyuh.value,

      bonusNerve: 3
    };
  }

  function renderResources() {
    const resources = getCalculatedResources();
    const bodyValue = document.getElementById('bodyValue');
    const mainNerveValue = document.getElementById('mainNerveValue');
    const bonusNerveValue = document.getElementById('bonusNerveValue');

    if (bodyValue) {
      bodyValue.textContent = resources.body;
    }

    if (mainNerveValue) {
      mainNerveValue.textContent = resources.mainNerve;
    }

    if (bonusNerveValue) {
      bonusNerveValue.textContent = resources.bonusNerve;
    }
  }

  /* =========================
     Навыки
  ========================= */

  function getSpentSkillPoints() {
    let spent = 0;

    Object.values(skills).forEach(function(group) {
      Object.values(group.items).forEach(function(skill) {
        spent += skill.value;
      });
    });

    return spent;
  }

  function getSkillPointsLeft() {
    return totalExtraSkillPoints - getSpentSkillPoints();
  }

  function changeSkill(groupKey, skillKey, delta) {
    const group = skills[groupKey];
    const skill = group && group.items ? group.items[skillKey] : null;
    if (!skill) return;
    const nextValue = Number(skill.value) + Number(delta);
    const maximum = advancedEditMode ? 3 : 2;
    if (nextValue < 0 || nextValue > maximum) return;
    if (!advancedEditMode && delta > 0 && getSkillPointsLeft() <= 0) return;
    if (
      !advancedEditMode &&
      delta > 0 &&
      Object.values(group.items).reduce(function (sum, item) {
        return sum + Number(item.value || 0);
      }, 0) >= maxStartingSkillGroupTotal
    ) return;
    skill.value = nextValue;
    renderSkills();
    refreshViewerIfOpen();
    if (typeof renderRollComponentOptions === 'function') renderRollComponentOptions();
  }

  function renderSkills() {
    const grid = document.getElementById('skillsGrid');
    const pointsLeft = document.getElementById('skillPointsLeft');
    const recommendationToggle = document.getElementById('showRecommendedSkills');
    const recommendationLegend = document.getElementById('skillRecommendationLegend');

    if (!grid || !pointsLeft) return;

    const selectedClass = document.getElementById('className')?.value || '';
    const recommendations = classRecommendedSkills[selectedClass] || {};
    const primarySkills = new Set(recommendations.primary || []);
    const secondarySkills = new Set(
      classSecondarySkills.filter(function(path) {
        return !primarySkills.has(path);
      })
    );
    const showRecommended = Boolean(recommendationToggle?.checked && selectedClass);

    if (recommendationLegend) {
      recommendationLegend.hidden = !recommendationToggle?.checked;
    }

    pointsLeft.textContent = advancedEditMode
      ? 'режим развития'
      : getSkillPointsLeft();

    grid.innerHTML = '';

    Object.entries(skills).forEach(function(groupEntry) {
      const groupKey = groupEntry[0];
      const group = groupEntry[1];
      const column = document.createElement('div');
      let html = `<h3>${group.attributeName}</h3>`;

      column.className = 'skill-column';

      Object.entries(group.items).forEach(function(skillEntry) {
        const skillKey = skillEntry[0];
        const skill = skillEntry[1];
        const path = `${groupKey}:${skillKey}`;
        const isPrimary = showRecommended && primarySkills.has(path);
        const isSecondary = showRecommended && secondarySkills.has(path);

        html += `
          <div class="skill-item ${isPrimary ? 'recommended-primary' : ''} ${isSecondary ? 'recommended-secondary' : ''}">
            <details class="skill-name skill-info">
              <summary>
                <span class="skill-name-text">${hyphenateSkillName(skill.name)}</span>
                ${isPrimary ? '<span class="skill-recommended-mark primary" aria-label="Основной навык класса" title="Основной навык класса">★</span>' : ''}
                ${isSecondary ? '<span class="skill-recommended-mark secondary" aria-label="Спас класса" title="Спас класса">◆</span>' : ''}
              </summary>
              <p>${skill.description || 'Описание отсутствует.'}</p>
            </details>

            <div class="mini-counter">
              <button
                type="button"
                onclick="changeSkill('${groupKey}', '${skillKey}', -1)"
              >
                −
              </button>

              <strong>${skill.value}</strong>

              <button
                type="button"
                onclick="changeSkill('${groupKey}', '${skillKey}', 1)"
              >
                +
              </button>
            </div>
          </div>
        `;
      });

      column.innerHTML = html;
      grid.appendChild(column);
    });
  }

  function getSelectedClassName() {
    const select = document.getElementById('className');
    return select ? select.value : '';

      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

  function generateEducationSpecialization(cardId) {
    const options = educationSpecializations[cardId] || [];
    if (!options.length) return;
    const next = options[Math.floor(Math.random() * options.length)];
    setBiographyDetail('education', next);
    renderBiographyEditor();
  }

  function selectBiographyCard(sectionId, cardId) {
    currentBiography = normalizeBiography(currentBiography);

    if (!currentBiography[sectionId]) {
      return;
    }

    const previousCardId = currentBiography[sectionId].cardId;

    currentBiography[sectionId].cardId = cardId;

    if (previousCardId !== cardId) {
      currentBiography[sectionId].detail = '';
    }

    renderBiographyEditor();
    refreshViewerIfOpen();
  }

  function setBiographyDetail(sectionId, value) {
    currentBiography = normalizeBiography(currentBiography);

    if (!currentBiography[sectionId]) {
      return;
    }

    currentBiography[sectionId].detail = String(value || '');
    refreshViewerIfOpen();
  }

  function renderBiographyChoice(section, card, selection) {
    const isSelected = selection.cardId === card.id;
    const traits = (card.traits || []).map(function(trait) {
      return `
        <li>
          <strong>${escapeBiographyHtml(trait.name)}</strong>
        </li>
      `;
    }).join('');

    return `
      <button
        type="button"
        class="biography-choice-card${isSelected ? ' selected' : ''}"
        aria-pressed="${isSelected ? 'true' : 'false'}"
        onclick="selectBiographyCard('${section.id}', '${card.id}')"
      >
        <span class="biography-choice-name">
          ${escapeBiographyHtml(card.name)}
        </span>

        <span class="biography-choice-description">
          ${escapeBiographyHtml(card.description || '')}
        </span>

        <ul class="biography-choice-traits">
          ${traits}
        </ul>
      </button>
    `;
  }

  function renderBiographySelectedDetails(section, selection) {
    const card = getBiographyCard(section.id, selection.cardId);

    if (!card) {
      return `
        <p class="biography-selection-note">
          Выберите одну карточку этого раздела.
        </p>
      `;
    }

    const traits = (card.traits || []).map(function(trait) {
      return `
        <article class="biography-trait-preview">
          <strong>${escapeBiographyHtml(trait.name)}</strong>
          <p>${escapeBiographyHtml(trait.description)}</p>
        </article>
      `;
    }).join('');

    const isEducation = section.id === 'education';
    const detailField = card.requiresDetail
      ? `
        <div class="${isEducation ? 'biography-specialization-panel' : ''}">
        <label class="field biography-detail-field">
          <span>
            ${escapeBiographyHtml(
              section.detailLabel || 'Уточнение'
            )}
          </span>

          <input
            type="text"
            value="${escapeBiographyHtml(selection.detail || '')}"
            placeholder="${escapeBiographyHtml(card.detailPlaceholder || '')}"
            oninput="setBiographyDetail('${section.id}', this.value)"
          >
        </label>
        ${isEducation ? `
          <button type="button" class="secondary-button biography-specialization-generator" onclick="generateEducationSpecialization('${card.id}')">
            Сгенерировать специализацию
          </button>
          <small>В библиотеке: ${(educationSpecializations[card.id] || []).length} вариантов. Значение можно изменить вручную.</small>
        ` : ''}
        </div>
      `
      : '';

    const note = card.note
      ? `
        <p class="biography-card-note">
          ${escapeBiographyHtml(card.note)}
        </p>
      `
      : '';

    return `
      <div class="biography-selected-card${isEducation ? ' education-selected-card' : ''}">
        <div class="biography-selected-heading">
          <strong>${escapeBiographyHtml(card.name)}</strong>
          <span>${escapeBiographyHtml(card.description || '')}</span>
        </div>

        ${note}
        ${detailField}

        <div class="biography-trait-preview-grid">
          ${traits}
        </div>
      </div>
    `;
  }

  function renderBiographyEditor() {
    const container = document.getElementById('biographyEditor');

    if (!container) return;

    currentBiography = normalizeBiography(currentBiography);

    container.innerHTML = biographyData.sections.map(function(section) {
      const selection = currentBiography[section.id];
      const choices = section.cards.map(function(card) {
        return renderBiographyChoice(section, card, selection);
      }).join('');

      return `
        <section class="biography-section">
          <div class="biography-section-heading">
            <h3>${escapeBiographyHtml(section.title)}</h3>
            <p>${escapeBiographyHtml(section.description || '')}</p>
          </div>

          <div class="biography-choice-grid">
            ${choices}
          </div>

          ${renderBiographySelectedDetails(section, selection)}
        </section>
      `;
    }).join('');
  }

  function collectBiographyForSave() {
    currentBiography = normalizeBiography(currentBiography);
    return currentBiography;
  }

  function applyBiography(savedBiography) {
    currentBiography = normalizeBiography(savedBiography);
    renderBiographyEditor();
  }

  function resetBiography() {
    currentBiography = createEmptyBiography();
    renderBiographyEditor();
  }

  /* =========================
     Сбор данных
  ========================= */

  function collectAttributesForSave() {
    const result = {};

    Object.entries(attributes).forEach(function(entry) {
      result[entry[0]] = entry[1].value;
    });

    return result;
  }

  function collectSkillsForSave() {
    const result = {};

    Object.entries(skills).forEach(function(groupEntry) {
      const groupKey = groupEntry[0];
      const group = groupEntry[1];

      result[groupKey] = {};

      Object.entries(group.items).forEach(function(skillEntry) {
        result[groupKey][skillEntry[0]] = skillEntry[1].value;
      });
    });

    return result;
  }

  function collectResourcesForSave() {
    return getCalculatedResources();
  }

  function collectCharacterForSave() {
    return {
      id: currentCharacterId,
      name: document.getElementById('characterName').value.trim(),
      player: document.getElementById('playerName').value.trim(),
      level: Math.max(
        1,
        Math.min(
          20,
          Math.round(
            Number(document.getElementById('characterLevel').value) || 1
          )
        )
      ),
      className: document.getElementById('className').value,
      concept: document.getElementById('concept').value.trim(),
      biography: collectBiographyForSave(),
      control: collectCharacterControl(),
      advancedEditMode: advancedEditMode,
      skillRulesVersion: 6,
      attributeRulesVersion: 2,
      attributes: collectAttributesForSave(),
      skills: collectSkillsForSave(),
      resources: collectResourcesForSave(),
      abilities: selectedAbilities.slice(),
      equipment: selectedEquipment.slice(),
      equipmentSpent: getSelectedEquipmentTotal(),
      equipmentMaintenance: getSelectedEquipmentMaintenanceTotal(),
      state: viewerState
        ? JSON.parse(JSON.stringify({ ...viewerState, initialized: true }))
        : undefined
    };
  }

  function setCharacterCompletionStatus(isComplete) {
    currentCharacterIsComplete = Boolean(isComplete);
    const banner = document.getElementById('characterDraftBanner');
    if (banner) banner.hidden = currentCharacterIsComplete;
  }

  /* =========================
     Проверка
  ========================= */

  function validateCharacterOnClient(character) {
    const errors = [];

    if (!character.name) {
      errors.push('Укажите имя персонажа.');
    }

    if (!character.className) {
      errors.push('Выберите класс.');
    }

    if (
      !Number.isInteger(Number(character.level)) ||
      Number(character.level) < 1 ||
      Number(character.level) > 20
    ) {
      errors.push('Уровень должен быть целым числом от 1 до 20.');
    }

    const biographyValidation = validateBiography(
      character.biography
    );

    if (!biographyValidation.valid) {
      errors.push.apply(
        errors,
        biographyValidation.errors
      );
    }

    if (
      !advancedEditMode &&
      getAttributePointsLeft() !== 0
    ) {
      errors.push('Распределите все очки Атрибутов.');
    }

    if (
      !advancedEditMode &&
      getSkillPointsLeft() !== 0
    ) {
      errors.push('Распределите все очки Навыков.');
    }

    if (
      !advancedEditMode &&
      getControlPointsLeft() !== 0
    ) {
      errors.push('Распределите все 3 очка Методик.');
    }

    if (!advancedEditMode) {
      Object.values(skills).forEach(function (group) {
        const groupTotal = Object.values(group.items).reduce(
          function (sum, skill) {
            return sum + Number(skill.value || 0);
          },
          0
        );

        if (groupTotal > maxStartingSkillGroupTotal) {
          errors.push(
            'Сумма Навыков Атрибута «' +
            group.attributeName +
            '» не может превышать 6.'
          );
        }
      });
    }

    if (!advancedEditMode) {
      if (character.abilities.length !== 3) {
        errors.push('Выберите ровно 3 способности.');
      }

      const selectedCategories = character.abilities
        .map(function(abilityId) {
          return getAbilityById(abilityId);
        })
        .filter(Boolean)
        .map(function(ability) {
          return ability.category;
        });

      const uniqueCategories = new Set(selectedCategories);

      if (
        uniqueCategories.size !== 3 ||
        !uniqueCategories.has('ultimate') ||
        !uniqueCategories.has('favorite') ||
        !uniqueCategories.has('common')
      ) {
        errors.push(
          'На старте выберите по одной способности из каждой категории: Ультимативная, Любимый приём, Обычное дело.'
        );
      }
    }

    if (!currentCharacterId && character.equipmentSpent > startingMoney) {
      errors.push(
        'Стоимость снаряжения превышает 1000 ф.'
      );
    }

    return errors;
  }

  /* =========================
     Загрузка персонажа в форму
  ========================= */

  function migrateLoadedCharacterRules(character) {
    const result = character || {};
    const oldAttributes = result.attributes || {};
    if (Number(result.attributeRulesVersion || 0) < 2) {
      result.attributes = {
        napor: oldAttributes.napor,
        snorovka: oldAttributes.smetka,
        nyuh: oldAttributes.nyuh,
        smetka: oldAttributes.zhila,
        gospodstvo: oldAttributes.losk
      };
      result.attributeRulesVersion = 2;
    }

    if (Number(result.skillRulesVersion || 0) < 4) {
      const oldSkills = result.skills || {};
      const values = Object.values(oldSkills).flatMap(function(group) {
        return Object.values(group || {}).map(Number);
      });
      const oldVersion = Number(result.skillRulesVersion || 0);
      const oneBased = values.length > 0 && values.every(function(value) {
        return Number.isFinite(value) && value >= 1;
      }) && (oldVersion < 2 || (oldVersion === 2 && !result.advancedEditMode && values.reduce(function(sum, value) { return sum + value; }, 0) > 21));
      const read = function(groupKey, skillKey) {
        const value = Number(oldSkills[groupKey]?.[skillKey]);
        if (!Number.isFinite(value)) return 0;
        return Math.max(0, Math.min(3, Math.round(value) - (oneBased ? 1 : 0)));
      };
      result.skills = {
        napor: {
          stoikost: read('napor', 'stoikost'),
          draka: read('napor', 'sila'),
          atletika: read('zhila', 'atletika'),
          disciplina: read('zhila', 'disciplina'),
          vyzhivanie: read('losk', 'vnushenie')
        },
        snorovka: {
          fehtovanie: read('napor', 'draka'),
          skrytnost: read('smetka', 'skrytnost'),
          lovkostRuk: read('smetka', 'lovkostRuk'),
          uklonenie: read('smetka', 'uklonenie'),
          strelba: read('nyuh', 'strelba')
        },
        nyuh: {
          priroda: read('nyuh', 'priroda'),
          vnimatelnost: read('nyuh', 'vnimatelnost'),
          znanieUlits: read('nyuh', 'znanieUlits'),
          psihologiya: read('losk', 'psiho'),
          etiket: read('losk', 'etiket')
        },
        smetka: {
          mehanizmy: read('smetka', 'mehanizmy'),
          zakon: read('nyuh', 'zakon'),
          ekonomika: read('zhila', 'ekonomika'),
          himiya: read('zhila', 'himiya'),
          medicina: read('zhila', 'medicina')
        },
        gospodstvo: {
          ugrozy: read('napor', 'ugrozy'),
          obman: read('smetka', 'obman'),
          komandovanie: read('napor', 'liderstvo'),
          ubezhdenie: read('losk', 'ubezhdenie'),
          scena: read('losk', 'scena')
        }
      };
      result.skillRulesVersion = 4;
    }

    if (Number(result.skillRulesVersion || 0) < 5) {
      const previous = result.skills || {};
      const value = function(groupKey, skillKey) {
        const parsed = Number(previous[groupKey]?.[skillKey]);
        return Number.isFinite(parsed) ? Math.max(0, Math.min(3, Math.round(parsed))) : 0;
      };
      result.skills = {
        napor: {
          fehtovanie: value('snorovka', 'fehtovanie'),
          atletika: value('napor', 'atletika'),
          stoikost: value('napor', 'stoikost'),
          sila: 0,
          vyzhivanie: value('napor', 'vyzhivanie')
        },
        snorovka: {
          draka: value('napor', 'draka'),
          uklonenie: value('snorovka', 'uklonenie'),
          skrytnost: value('snorovka', 'skrytnost'),
          lovkostRuk: value('snorovka', 'lovkostRuk'),
          obman: value('gospodstvo', 'obman')
        },
        nyuh: {
          vnimatelnost: value('nyuh', 'vnimatelnost'),
          strelba: value('snorovka', 'strelba'),
          priroda: value('nyuh', 'priroda'),
          znanieUlits: value('nyuh', 'znanieUlits'),
          psihologiya: value('nyuh', 'psihologiya')
        },
        smetka: {
          mehanizmy: value('smetka', 'mehanizmy'),
          himiya: value('smetka', 'himiya'),
          medicina: value('smetka', 'medicina'),
          zakon: value('smetka', 'zakon'),
          erudiciya: value('smetka', 'ekonomika')
        },
        gospodstvo: {
          ugrozy: value('gospodstvo', 'ugrozy'),
          ubezhdenie: value('gospodstvo', 'ubezhdenie'),
          komandovanie: value('gospodstvo', 'komandovanie'),
          disciplina: value('napor', 'disciplina'),
          scena: value('gospodstvo', 'scena')
        }
      };
      result.skillRulesVersion = 5;
    }

    if (Number(result.skillRulesVersion || 0) < 6) {
      const previous = result.skills || {};
      const value = function(groupKey, skillKey) {
        const parsed = Number(previous[groupKey]?.[skillKey]);
        return Number.isFinite(parsed) ? Math.max(0, Math.min(3, Math.round(parsed))) : 0;
      };
      result.skills = {
        napor: {
          fehtovanie: value('napor', 'fehtovanie'),
          draka: value('snorovka', 'draka'),
          metanie: 0,
          stoikost: value('napor', 'stoikost'),
          sila: value('napor', 'sila'),
          vyzhivanie: value('napor', 'vyzhivanie')
        },
        snorovka: {
          koordinatsiya: value('napor', 'atletika'),
          vozhdenie: 0,
          uklonenie: value('snorovka', 'uklonenie'),
          skrytnost: value('snorovka', 'skrytnost'),
          lovkostRuk: value('snorovka', 'lovkostRuk'),
          obman: value('snorovka', 'obman')
        },
        nyuh: {
          vnimatelnost: value('nyuh', 'vnimatelnost'),
          strelba: value('nyuh', 'strelba'),
          priroda: value('nyuh', 'priroda'),
          znanieUlits: value('nyuh', 'znanieUlits'),
          psihologiya: value('nyuh', 'psihologiya'),
          vospriyatie: 0
        },
        smetka: {
          mehanizmy: value('smetka', 'mehanizmy'),
          himiya: value('smetka', 'himiya'),
          medicina: value('smetka', 'medicina'),
          zakon: value('smetka', 'zakon'),
          erudiciya: value('smetka', 'erudiciya'),
          ekonomika: 0
        },
        gospodstvo: {
          ugrozy: value('gospodstvo', 'ugrozy'),
          ubezhdenie: value('gospodstvo', 'ubezhdenie'),
          komandovanie: value('gospodstvo', 'komandovanie'),
          disciplina: value('gospodstvo', 'disciplina'),
          scena: value('gospodstvo', 'scena'),
          etiket: 0
        }
      };
      result.skillRulesVersion = 6;
    }
    return result;
  }

  function applyCharacterToForm(character) {
    character = migrateLoadedCharacterRules(character || {});

    currentCharacterId = character.id || null;
    setCharacterCompletionStatus(character.isComplete !== false);

    document.getElementById('characterName').value =
      character.name || '';

    document.getElementById('playerName').value =
      character.player || '';

    document.getElementById('characterLevel').value =
      Math.max(
        1,
        Math.min(20, Math.round(Number(character.level) || 1))
      );

    document.getElementById('className').value =
      character.className || '';

    document.getElementById('concept').value =
      character.concept || '';

    setCharacterControl(
      character.control,
      character.className || ''
    );

    setAdvancedEditMode(
      Boolean(character.advancedEditMode)
    );

    applyAttributes(character.attributes || {});
    applySkills(
      character.skills || {},
      character.skillRulesVersion
    );
    character.resources = getCalculatedResources();
    applyBiography(character.biography || {});

    selectedAbilities.length = 0;

    (character.abilities || []).forEach(function(abilityId) {
      selectedAbilities.push(abilityId);
    });

    activeAbilityId = selectedAbilities[0] || null;

    selectedEquipment.length = 0;

    (character.equipment || []).forEach(function(equipmentId) {
      selectedEquipment.push(equipmentId);
    });

    if (typeof setViewerStateFromCharacter === 'function') {
      setViewerStateFromCharacter(character);
    }

    renderAttributes();
    renderSkills();
    renderBiographyEditor();
    setCharacterCompletionStatus(
      validateCharacterOnClient(collectCharacterForSave()).length === 0
    );
    renderAbilities();
    renderEquipment();
    refreshViewerIfOpen();
  }

  function applyAttributes(savedAttributes) {
    Object.entries(attributes).forEach(function(entry) {
      const key = entry[0];
      const attribute = entry[1];
      const savedValue = savedAttributes[key] !== undefined ? Number(savedAttributes[key]) || 1 : 1;
      attribute.value = Math.max(1, Math.min(3, savedValue));
    });
  }

  function applySkills(savedSkills, skillRulesVersion) {
    const savedValues = [];

    Object.values(savedSkills || {}).forEach(function (group) {
      Object.values(group || {}).forEach(function (value) {
        savedValues.push(Number(value));
      });
    });

    const legacySkills =
      Number(skillRulesVersion || 0) < 2 &&
      savedValues.length > 0 &&
      savedValues.every(function (value) {
        return Number.isFinite(value) && value >= 1;
      });

    Object.entries(skills).forEach(function(groupEntry) {
      const groupKey = groupEntry[0];
      const group = groupEntry[1];
      Object.entries(group.items).forEach(function(skillEntry) {
        const skillKey = skillEntry[0];
        const skill = skillEntry[1];
        const savedValue = savedSkills[groupKey] && savedSkills[groupKey][skillKey] !== undefined
          ? Number(savedSkills[groupKey][skillKey]) || 0
          : 0;
        skill.value = Math.max(
          0,
          Math.min(
            3,
            savedValue - (legacySkills ? 1 : 0)
          )
        );
      });
    });
  }

  function resetAttributes() {
    Object.values(attributes).forEach(function(attribute) {
      attribute.value = 1;
    });
  }

  function resetSkills() {
    Object.values(skills).forEach(function(group) {
      Object.values(group.items).forEach(function(skill) {
        skill.value = 0;
      });
    });
  }

  function resetAllSkills() {
    resetSkills();
    renderSkills();
    refreshViewerIfOpen();
    if (typeof renderRollComponentOptions === 'function') renderRollComponentOptions();
  }

  function startNewCharacter() {
    currentCharacterId = null;
    setCharacterCompletionStatus(false);

    document.getElementById('characterName').value = '';
    document.getElementById('playerName').value = '';
    document.getElementById('characterLevel').value = '1';
    document.getElementById('className').value = '';
    document.getElementById('concept').value = '';

    setAdvancedEditMode(false);
    resetAttributes();
    resetSkills();
    resetBiography();
    resetCharacterControlForClass('');

    selectedAbilities.length = 0;
    activeAbilityId = null;
    selectedEquipment.length = 0;

    if (typeof setViewerStateFromCharacter === 'function') {
      setViewerStateFromCharacter({
        id: null,
        resources: collectResourcesForSave(),
        state: {}
      });
    }

    renderAttributes();
    renderSkills();
    renderBiographyEditor();
    renderAbilities();
    renderEquipment();
    if (typeof syncClassIconPicker === 'function') syncClassIconPicker();
    if (typeof renderRollComponentOptions === 'function') renderRollComponentOptions();

    setLoadStatus('Создана пустая форма.', false);
    setSaveStatus('', false);
  }

  document.addEventListener('DOMContentLoaded', function() {
    renderBiographyEditor();
  });
</script>
