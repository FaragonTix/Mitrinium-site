<script>
  // Снаряжение, рекомендации, стоимость, обслуживание и броня.

  const equipmentFilters = {
    recommended: 'all',
    other: 'all'
  };

  function getEquipmentById(equipmentId) {
    return equipmentData.find(item => item.id === equipmentId);
  }

  function getSelectedEquipmentTotal() {
    return selectedEquipment.reduce((sum, equipmentId) => {
      const item = getEquipmentById(equipmentId);
      return sum + (item ? Number(item.price || 0) : 0);
    }, 0);
  }

  function getEquipmentMaintenance(item) {
    return Number(item.maintenance || 0);
  }

  function getEquipmentMaintenanceText(item) {
    const maintenance = getEquipmentMaintenance(item);
    return maintenance > 0 ? `Обслуживание: ${maintenance} ф` : '';
  }

  function getSelectedEquipmentMaintenanceTotal() {
    return selectedEquipment.reduce((sum, equipmentId) => {
      const item = getEquipmentById(equipmentId);
      return sum + (item ? getEquipmentMaintenance(item) : 0);
    }, 0);
  }

  function isEquipmentSelected(equipmentId) {
    return selectedEquipment.includes(equipmentId);
  }

  function isConsumableEquipment(item) {
    return Boolean(item && String(item.purpose || '').toLowerCase().includes('расходник'));
  }

  function isHiddenEquipmentItem(item) {
    return Boolean(item && getEquipmentSearchText(item).includes('особое'));
  }

  function getEquipmentFilterCategory(item) {
    if (!item) return 'other';
    if (item.category === 'Броня') return 'armor';
    if (item.category === 'Кристаллы') return 'crystal';
    if (item.category === 'Набор') return 'kit';
    if (isConsumableEquipment(item) || item.category === 'Расходник') return 'consumable';
    if (item.category === 'Метательное оружие') return 'thrown';
    if (item.category === 'Ближнее оружие') return 'melee';
    if (item.category === 'Дальнее оружие') return 'ranged';
    const range = String(item.range || '').toLowerCase();
    if (range.includes('ближн')) return 'melee';
    if (range || (item.tags || []).some(tag => String(tag).toLowerCase() === 'пистоль')) return 'ranged';
    if (['Оружие', 'Специальное оружие'].includes(item.category) || ['Нож-капельник', 'Трость с кристаллическим навершием'].includes(item.name)) return 'melee';
    return 'other';
  }

  function matchesEquipmentFilter(item, filter) {
    return !filter || filter === 'all' || getEquipmentFilterCategory(item) === filter;
  }

  function setEquipmentFilter(scope, filter) {
    if (!Object.prototype.hasOwnProperty.call(equipmentFilters, scope)) return;
    equipmentFilters[scope] = filter || 'all';
    renderEquipment();
  }

  function updateEquipmentFilterButtons() {
    document.querySelectorAll('[data-equipment-scope][data-equipment-filter]').forEach(button => {
      const active = equipmentFilters[button.dataset.equipmentScope] === button.dataset.equipmentFilter;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    });
  }

  function getSelectedEquipmentCount(equipmentId) {
    return selectedEquipment.filter(id => id === equipmentId).length;
  }

  function getAvailableEquipmentFarthings() {
    if (viewerState?.money && Number.isFinite(Number(viewerState.money.farthings))) {
      return Math.max(0, Number(viewerState.money.farthings));
    }

    return Math.max(0, startingMoney - getSelectedEquipmentTotal());
  }

  function changeEquipmentFarthings(delta) {
    if (!viewerState) return;
    viewerState.money = viewerState.money || { gold: 0, farthings: 0, pekkels: 0 };
    viewerState.money.farthings = Math.max(
      0,
      Number(viewerState.money.farthings || 0) + Number(delta || 0)
    );
    viewerState.initialized = true;
    if (typeof markViewerStateUnsaved === 'function') markViewerStateUnsaved();
  }

  function addEquipment(equipmentId) {
    const item = getEquipmentById(equipmentId);
    if (!item || (isEquipmentSelected(equipmentId) && !isConsumableEquipment(item))) return;
    const price = Math.max(0, Number(item.price || 0));
    if (price > getAvailableEquipmentFarthings()) {
      const warning = document.getElementById('equipmentWarning');
      if (warning) {
        warning.classList.remove('hidden');
        warning.textContent = `Недостаточно текущих денег: требуется ${price} ф.`;
      }
      return;
    }
    const previousArmor = getSelectedArmorTotal();
    selectedEquipment.push(equipmentId);
    changeEquipmentFarthings(-price);
    syncViewerArmorWithEquipment(previousArmor);
    renderEquipment();
    refreshViewerIfOpen();
  }

  function removeEquipment(equipmentId) {
    const index = selectedEquipment.indexOf(equipmentId);
    if (index === -1) return;
    const item = getEquipmentById(equipmentId);
    const previousArmor = getSelectedArmorTotal();
    selectedEquipment.splice(index, 1);
    changeEquipmentFarthings(Number(item?.price || 0));
    syncViewerArmorWithEquipment(previousArmor);
    renderEquipment();
    refreshViewerIfOpen();
  }

  function getEquipmentDetails(item, omitQuickStats = false) {
    const details = [];
    if (item.armor) details.push(`Броня: ${item.armor}`);
    if (item.pool) details.push(`Пул: ${item.pool}`);
    if (item.range) details.push(`Дистанция: ${item.range}`);
    if (!omitQuickStats && hasVisibleEquipmentDamage(item)) details.push(`Урон: ${item.damage}`);
    if (!omitQuickStats && item.exploitation !== undefined && item.exploitation !== '') details.push(`Экспл.: ${item.exploitation}`);
    if (!omitQuickStats && item.durability !== undefined && item.durability !== '') details.push(`Прочность: ${item.durability}`);
    if (getEquipmentMaintenanceText(item)) details.push(getEquipmentMaintenanceText(item));
    if (item.purpose) details.push(item.purpose);
    if (item.tags && item.tags.length) details.push(`Теги: ${item.tags.join(', ')}`);
    return details.join(' · ');
  }

  function hasVisibleEquipmentDamage(item) {
    return Boolean(item?.damage)
      && String(item.damage).trim().toLowerCase() !== 'зависит от способности';
  }

  function renderEquipmentQuickStats(item) {
    const stats = [];
    if (hasVisibleEquipmentDamage(item)) stats.push(['Урон', item.damage]);
    if (item.exploitation !== undefined && item.exploitation !== '') {
      stats.push(['Экспл.', item.exploitation]);
    }
    if (item.durability !== undefined && item.durability !== '') {
      stats.push(['Прочность', item.durability]);
    }
    if (!stats.length) return '';

    return `<div class="equipment-quick-stats">${stats.map(stat => `
      <span class="equipment-quick-stat">
        <small>${escapeViewerHtml(stat[0])}</small>
        <strong>${escapeViewerHtml(stat[1])}</strong>
      </span>`).join('')}</div>`;
  }

  function getEquipmentSearchText(item) {
    return [
      item.name, item.category, item.price, item.priceText, item.maintenance,
      item.pool, item.range, item.damage, item.armor, item.exploitation, item.durability, item.purpose,
      item.reliability, item.tags ? item.tags.join(' ') : ''
    ].filter(Boolean).join(' ').toLowerCase();
  }

  function renderEquipmentCard(item, isRecommended) {
    const price = item.priceText || `${item.price} ф`;
    const selected = isEquipmentSelected(item.id);
    const canHaveSeveral = isConsumableEquipment(item);
    const selectedCount = getSelectedEquipmentCount(item.id);
    const details = getEquipmentDetails(item, true);
    const quickStats = renderEquipmentQuickStats(item);

    return `
      <div class="equipment-card ${isRecommended ? 'recommended' : ''}">
        <div class="equipment-card-main">
          <div>
            <div class="equipment-name">${item.name}${selectedCount > 1 ? ` ×${selectedCount}` : ''}</div>
            <div class="equipment-meta">${item.category} · ${price}</div>
            ${quickStats}
            <div class="equipment-details">${details}</div>
          </div>
          <button type="button" class="equipment-button" onclick="${selected && !canHaveSeveral ? `removeEquipment('${item.id}')` : `addEquipment('${item.id}')`}">
            ${selected && !canHaveSeveral ? '-' : '+'}
          </button>
        </div>
      </div>`;
  }

  function renderSelectedEquipment() {
    const container = document.getElementById('selectedEquipmentList');
    if (!container) return;

    if (selectedEquipment.length === 0) {
      container.innerHTML = '<p class="empty-note">Пока ничего не выбрано.</p>';
      return;
    }

    container.innerHTML = selectedEquipment.map(equipmentId => {
      const item = getEquipmentById(equipmentId);
      if (!item) return '';
      const details = getEquipmentDetails(item);
      return `
        <div class="selected-equipment-item selected-equipment-item-detailed">
          <div>
            <div class="selected-equipment-name">${item.name}</div>
            <div class="selected-equipment-details">${details || item.category}</div>
          </div>
          <strong>${item.priceText || `${item.price} ф`}</strong>
          <button type="button" onclick="removeEquipment('${item.id}')">×</button>
        </div>`;
    }).join('');
  }

  function renderEquipmentSummary() {
    const spent = getSelectedEquipmentTotal();
    const maintenance = getSelectedEquipmentMaintenanceTotal();
    const left = getAvailableEquipmentFarthings();

    const spentElement = document.getElementById('equipmentSpent');
    const leftElement = document.getElementById('equipmentLeft');
    const maintenanceElement = document.getElementById('equipmentMaintenance');
    const stickyAvailableElement = document.getElementById('equipmentAvailableSticky');
    const warning = document.getElementById('equipmentWarning');

    if (spentElement) spentElement.textContent = `${spent} ф`;
    if (leftElement) leftElement.textContent = `${left} ф`;
    if (stickyAvailableElement) stickyAvailableElement.textContent = `${left} ф`;
    if (maintenanceElement) maintenanceElement.textContent = `${maintenance} ф`;

    if (!warning) return;

    warning.classList.add('hidden');
    warning.textContent = '';
  }

  function renderEquipment() {
    const recommendedList = document.getElementById('recommendedEquipmentList');
    const otherList = document.getElementById('otherEquipmentList');
    if (!recommendedList || !otherList) return;

    const className = getSelectedClassName();
    const recommendedIds = classRecommendedEquipment[className] || [];
    const searchInput = document.getElementById('equipmentSearch');
    const searchQuery = searchInput ? searchInput.value.trim().toLowerCase() : '';

    let recommendedItems = recommendedIds.map(getEquipmentById).filter(item => item && !isHiddenEquipmentItem(item));
    let otherItems = equipmentData
      .filter(item => !recommendedIds.includes(item.id) && !isHiddenEquipmentItem(item))
      .sort((a, b) => {
        if (a.category === b.category) return Number(a.price || 0) - Number(b.price || 0);
        return a.category.localeCompare(b.category);
      });

    recommendedItems = recommendedItems.filter(item => matchesEquipmentFilter(item, equipmentFilters.recommended));
    otherItems = otherItems.filter(item => matchesEquipmentFilter(item, equipmentFilters.other));

    if (searchQuery) {
      recommendedItems = recommendedItems.filter(item => getEquipmentSearchText(item).includes(searchQuery));
      otherItems = otherItems.filter(item => getEquipmentSearchText(item).includes(searchQuery));
    }

    recommendedList.innerHTML = recommendedItems.length
      ? recommendedItems.map(item => renderEquipmentCard(item, true)).join('')
      : searchQuery || equipmentFilters.recommended !== 'all'
        ? '<p class="empty-note">В рекомендациях по выбранному фильтру ничего не найдено.</p>'
        : '<p class="empty-note">Выберите класс, чтобы увидеть рекомендации.</p>';

    otherList.innerHTML = otherItems.length
      ? otherItems.map(item => renderEquipmentCard(item, false)).join('')
      : '<p class="empty-note">В общем списке ничего не найдено.</p>';

    updateEquipmentFilterButtons();
    renderSelectedEquipment();
    renderEquipmentSummary();
  }

  function getEquipmentArmor(item) {
  if (!item || item.armor === null || item.armor === undefined) {
    return 0;
  }

  if (typeof item.armor === 'number') {
    return Math.max(0, item.armor);
  }

  const match = String(item.armor).match(/\d+/);

  return match ? Math.max(0, Number(match[0])) : 0;
}

function getSelectedArmorTotal() {
  return selectedEquipment.reduce((total, equipmentId) => {
    const item = getEquipmentById(equipmentId);

    return total + getEquipmentArmor(item);
  }, 0);
}

function syncViewerArmorWithEquipment(previousEquipmentArmor) {
  if (!viewerState || typeof getSelectedArmorTotal !== 'function') {
    return;
  }

  const maxArmor = getSelectedArmorTotal();
  const previousArmor = Math.max(0, Number(previousEquipmentArmor || 0));
  if (maxArmor === previousArmor) return;

  const wasFull = viewerState.currentArmor === undefined ||
    Number(viewerState.currentArmor) >= Number(viewerState.maxArmor || previousArmor);
  viewerState.maxArmor = maxArmor;
  viewerState.currentArmor = wasFull
    ? maxArmor
    : Math.min(Math.max(0, Number(viewerState.currentArmor || 0)), maxArmor);
  viewerState.initialized = true;
  if (typeof markViewerStateUnsaved === 'function') markViewerStateUnsaved();
}
</script>
