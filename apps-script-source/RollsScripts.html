<script>
  let rollLogIsAdmin = false;
  let rollLogTimer = null;
  let rollLogEntries = [];

  let rollEditorMode = 'select';
  let latestEfficiencyRoll = null;
  let selectedEfficiencyDieIndex = null;

  // Один общий выбор для обеих таблиц:
  // максимум два компонента.
  let rollBuilderSelectedKeys = [];

  /* =========================
     Утилиты
  ========================= */

  function rollEscapeHtml(value) {
    return String(
      value === null ||
      value === undefined
        ? ''
        : value
    )
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function rollEscapeJs(value) {
    return String(value || '')
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'");
  }

  function rollNumber(value, fallback) {
    const number = Number(value);

    return Number.isFinite(number)
      ? number
      : Number(fallback || 0);
  }

  function getRollCharacterContext() {
    let character = {};

    if (
      typeof collectCharacterForSave ===
      'function'
    ) {
      character =
        collectCharacterForSave() || {};
    }

    return {
      characterId:
        currentCharacterId ||
        character.id ||
        '',

      characterName:
        character.name ||
        'Без имени',

      className:
        character.className ||
        ''
    };
  }

  function getRollTurnTracker() {
    const character = typeof getViewerCharacter === 'function'
      ? getViewerCharacter()
      : (typeof collectCharacterForSave === 'function' ? collectCharacterForSave() : {});
    const currentState = typeof ensureViewerState === 'function'
      ? ensureViewerState(character || {})
      : null;

    if (!currentState) return { moved: false, reaction: true, action: true };
    currentState.turnTracker = normalizeViewerTurnTracker(currentState.turnTracker);
    return currentState.turnTracker;
  }

  function renderRollTurnTracker() {
    const tracker = getRollTurnTracker();
    const controls = [
      { id: 'rollMovementState', key: 'moved', label: 'Передвижение', active: tracker.moved, activeText: '✓', inactiveText: '—' },
      { id: 'rollReactionState', key: 'reaction', label: 'Реакция', active: tracker.reaction, activeText: '+', inactiveText: '−' },
      { id: 'rollActionState', key: 'action', label: 'Действие', active: tracker.action, activeText: '+', inactiveText: '−' }
    ];

    controls.forEach(function(control) {
      const button = document.getElementById(control.id);
      if (!button) return;
      button.textContent = control.label + ' ' + (control.active ? control.activeText : control.inactiveText);
      button.setAttribute('aria-pressed', String(Boolean(control.active)));
      button.classList.toggle('available', Boolean(control.active));
      button.classList.toggle('spent', !control.active);
    });
  }

  function toggleRollTurnTracker(key) {
    if (!['moved', 'reaction', 'action'].includes(key)) return;
    const tracker = getRollTurnTracker();
    tracker[key] = !tracker[key];
    markViewerStateUnsaved();
    renderRollTurnTracker();
  }

  function resetRollTurnTracker() {
    const tracker = getRollTurnTracker();
    tracker.moved = false;
    tracker.reaction = true;
    tracker.action = true;
    markViewerStateUnsaved();
    renderRollTurnTracker();
  }

  function applyCharacterControlMethodToRoll() {
    const typeSelect = document.getElementById('rollControlType');
    const methodSelect = document.getElementById('rollControlMethod');
    const bonusInput = document.getElementById('rollControlFlatBonus');

    if (!typeSelect || !methodSelect || !bonusInput) return;

    const className = document.getElementById('className')?.value || '';
    const control = normalizeCharacterControl(characterControl, className);
    const method = control.methods[typeSelect.value];

    if (!method) return;

    methodSelect.value = 'fixed';
    bonusInput.value = String(method.bonus);
    syncRollBuilderControls();
  }

  /* =========================
     Компоненты
  ========================= */

  function getRollComponentDefinitions() {
    const definitions = [];

    const attributeSource =
      typeof attributes !== 'undefined'
        ? attributes
        : {};

    const skillSource =
      typeof skills !== 'undefined'
        ? skills
        : {};

    Object.entries(
      attributeSource
    ).forEach(function (entry) {
      definitions.push({
        key:
          'attribute:' +
          entry[0],

        group: 'attributes',

        label:
          entry[1].name,

        value: Math.max(
          1,
          Math.min(
            3,
            rollNumber(
              entry[1].value,
              1
            )
          )
        )
      });
    });

    Object.entries(
      skillSource
    ).forEach(function (groupEntry) {
      const groupKey =
        groupEntry[0];

      const group =
        groupEntry[1];

      Object.entries(
        group.items || {}
      ).forEach(function (skillEntry) {
        definitions.push({
          key:
            'skill:' +
            groupKey +
            ':' +
            skillEntry[0],

          group: 'skills',

          attributeKey:
            groupKey,

          attributeName:
            group.attributeName,

          label:
            skillEntry[1].name,

          value: Math.max(
            0,
            Math.min(
              3,
              rollNumber(
              skillEntry[1].value,
              0
              )
            )
          )
        });
      });
    });

    return definitions;
  }

  function renderRollComponentOptions() {
    const firstSelect =
      document.getElementById(
        'rollFirstComponent'
      );

    const secondSelect =
      document.getElementById(
        'rollSecondComponent'
      );

    if (
      !firstSelect ||
      !secondSelect
    ) {
      return;
    }

    const definitions =
      getRollComponentDefinitions();

    if (definitions.length === 0) {
      firstSelect.innerHTML = '';
      secondSelect.innerHTML = '';

      return;
    }

    const firstPrevious =
      firstSelect.value;

    const secondPrevious =
      secondSelect.value;

    const attributeOptions =
      definitions
        .filter(function (item) {
          return (
            item.group ===
            'attributes'
          );
        })
        .map(renderRollOption)
        .join('');

    const skillOptions =
      definitions
        .filter(function (item) {
          return (
            item.group ===
            'skills'
          );
        })
        .map(renderRollOption)
        .join('');

    const html = `
      <optgroup label="Атрибуты">
        ${attributeOptions}
      </optgroup>

      <optgroup label="Навыки">
        ${skillOptions}
      </optgroup>
    `;

    firstSelect.innerHTML = html;
    secondSelect.innerHTML = html;

    const validKeys =
      definitions.map(function (item) {
        return item.key;
      });

    const firstDefault =
      validKeys.indexOf(firstPrevious) !== -1
        ? firstPrevious
        : definitions[0].key;

    const firstSkill =
      definitions.find(function (item) {
        return item.group === 'skills';
      });

    let secondDefault =
      validKeys.indexOf(secondPrevious) !== -1
        ? secondPrevious
        : (
          firstSkill
            ? firstSkill.key
            : definitions[
                Math.min(
                  1,
                  definitions.length - 1
                )
              ].key
        );

    if (
      secondDefault === firstDefault &&
      definitions.length > 1
    ) {
      secondDefault =
        definitions.find(function (item) {
          return item.key !== firstDefault;
        }).key;
    }

    firstSelect.value = firstDefault;
    secondSelect.value = secondDefault;

    ensureRollBuilderSelection();
    renderRollComponentTables();
    syncRollBuilderControls();
  }

  function renderRollOption(definition) {
    return `
      <option
        value="${rollEscapeHtml(
          definition.key
        )}"
      >
        ${rollEscapeHtml(
          definition.label
        )}
        — ${definition.value}d6
      </option>
    `;
  }

  function ensureRollBuilderSelection() {
    const definitions =
      getRollComponentDefinitions();

    const validKeys =
      definitions.map(function (item) {
        return item.key;
      });

    rollBuilderSelectedKeys =
      rollBuilderSelectedKeys
        .filter(function (key) {
          return (
            validKeys.indexOf(key) !== -1
          );
        })
        .slice(0, 2);

    const firstValue =
      document.getElementById(
        'rollFirstComponent'
      )?.value || '';

    const secondValue =
      document.getElementById(
        'rollSecondComponent'
      )?.value || '';

    if (
      rollBuilderSelectedKeys.length === 0 &&
      validKeys.indexOf(firstValue) !== -1
    ) {
      rollBuilderSelectedKeys.push(
        firstValue
      );
    }

    if (
      rollBuilderSelectedKeys.length < 2 &&
      validKeys.indexOf(secondValue) !== -1 &&
      rollBuilderSelectedKeys.indexOf(
        secondValue
      ) === -1
    ) {
      rollBuilderSelectedKeys.push(
        secondValue
      );
    }
  }

  function syncRollBuilderSelectionFromSelects() {
    const firstValue =
      document.getElementById(
        'rollFirstComponent'
      )?.value || '';

    const secondValue =
      document.getElementById(
        'rollSecondComponent'
      )?.value || '';

    rollBuilderSelectedKeys = [];

    if (firstValue) {
      rollBuilderSelectedKeys.push(
        firstValue
      );
    }

    if (
      secondValue &&
      secondValue !== firstValue
    ) {
      rollBuilderSelectedKeys.push(
        secondValue
      );
    }

    renderRollComponentTables();
    syncRollBuilderControls();
  }

  function renderRollComponentTables() {
    const componentGroups =
      document.getElementById(
        'rollComponentGroups'
      );

    if (!componentGroups) {
      return;
    }

    const definitions =
      getRollComponentDefinitions();

    const attributeDefinitions =
      definitions.filter(function (item) {
        return item.group === 'attributes';
      });

    const skillDefinitions =
      definitions.filter(function (item) {
        return item.group === 'skills';
      });

    componentGroups.innerHTML =
      attributeDefinitions
        .map(function (attribute) {
          const groupKey =
            attribute.key.replace(
              'attribute:',
              ''
            );

          const relatedSkills =
            skillDefinitions.filter(
              function (skill) {
                return (
                  skill.attributeKey ===
                  groupKey
                );
              }
            );

          return `
            <div class="roll-component-group">
              ${renderRollComponentSquare(
                attribute,
                'roll-attribute-square'
              )}

              <div class="roll-component-skill-list">
                ${relatedSkills
                  .map(function (skill) {
                    return renderRollComponentSquare(
                      skill,
                      'roll-skill-square'
                    );
                  })
                  .join('')}
              </div>
            </div>
          `;
        })
        .join('');
  }

  function renderRollComponentSquare(
    definition,
    extraClass
  ) {
    return `
      <button
        type="button"
        class="roll-component-square ${extraClass || ''}"
        data-component-key="${rollEscapeHtml(
          definition.key
        )}"
        onclick="toggleRollBuilderComponent(
          '${rollEscapeJs(
            definition.key
          )}'
        )"
      >
        <span
          class="roll-component-square-name"
        >
          ${rollEscapeHtml(
            definition.label
          )}
        </span>

        <strong>
          ${definition.value}d6
        </strong>
      </button>
    `;
  }

  function toggleRollBuilderComponent(
    componentKey
  ) {
    const selectedIndex =
      rollBuilderSelectedKeys.indexOf(
        componentKey
      );

    if (selectedIndex !== -1) {
      rollBuilderSelectedKeys.splice(
        selectedIndex,
        1
      );

      syncRollSelectsFromBuilder();
      syncRollBuilderControls();

      return;
    }

    if (
      rollBuilderSelectedKeys.length >= 2
    ) {
      const definitions =
        getRollComponentDefinitions();

      const requested =
        definitions.find(function (item) {
          return item.key === componentKey;
        });

      const selectedDefinitions =
        rollBuilderSelectedKeys.map(function (key) {
          return definitions.find(function (item) {
            return item.key === key;
          });
        });

      const sameGroupIndexes =
        selectedDefinitions
          .map(function (item, index) {
            return item && requested &&
              item.group === requested.group
              ? index
              : -1;
          })
          .filter(function (index) {
            return index !== -1;
          });

      if (sameGroupIndexes.length === 1) {
        rollBuilderSelectedKeys[
          sameGroupIndexes[0]
        ] = componentKey;

        syncRollSelectsFromBuilder();
        syncRollBuilderControls();

        return;
      }

      updateRollBuilderSelectionStatus(
        'Можно выбрать только два компонента. ' +
        'Для двух Навыков или двух Атрибутов ' +
        'второй слот должен быть свободен.',
        true
      );

      return;
    }

    rollBuilderSelectedKeys.push(
      componentKey
    );

    syncRollSelectsFromBuilder();
    syncRollBuilderControls();
  }

  function syncRollSelectsFromBuilder() {
    if (
      rollBuilderSelectedKeys.length !== 2
    ) {
      return;
    }

    const firstSelect =
      document.getElementById(
        'rollFirstComponent'
      );

    const secondSelect =
      document.getElementById(
        'rollSecondComponent'
      );

    if (firstSelect) {
      firstSelect.value =
        rollBuilderSelectedKeys[0];
    }

    if (secondSelect) {
      secondSelect.value =
        rollBuilderSelectedKeys[1];
    }
  }

  function updateRollBuilderSelectionStatus(
    customMessage,
    isError
  ) {
    const status =
      document.getElementById(
        'rollBuilderSelectionStatus'
      );

    if (!status) {
      return;
    }

    if (customMessage) {
      status.textContent =
        customMessage;

      status.classList.toggle(
        'error',
        Boolean(isError)
      );

      return;
    }

    const count =
      rollBuilderSelectedKeys.length;

    status.classList.remove('error');

    if (count === 0) {
      status.textContent =
        'Выберите два компонента.';
    } else if (count === 1) {
      status.textContent =
        'Выбран один компонент. ' +
        'Выберите ещё один.';
    } else {
      status.textContent =
        'Выбрано компонентов: 2 из 2.';
    }
  }

  function getRollComponentByKey(
    componentKey
  ) {
    return getRollComponentDefinitions()
      .find(function (item) {
        return (
          item.key ===
          componentKey
        );
      }) || null;
  }

  function getEfficiencyComponentsForRequest() {
    if (rollEditorMode === 'builder') {
      if (
        rollBuilderSelectedKeys.length !== 2
      ) {
        throw new Error(
          'В конструкторе необходимо выбрать ' +
          'ровно два компонента.'
        );
      }

      const first =
        getRollComponentByKey(
          rollBuilderSelectedKeys[0]
        );

      const second =
        getRollComponentByKey(
          rollBuilderSelectedKeys[1]
        );

      if (!first || !second) {
        throw new Error(
          'Не удалось получить выбранные компоненты.'
        );
      }

      return [
        first,
        second
      ];
    }

    const first =
      getRollComponentByKey(
        document.getElementById(
          'rollFirstComponent'
        )?.value || ''
      );

    const second =
      getRollComponentByKey(
        document.getElementById(
          'rollSecondComponent'
        )?.value || ''
      );

    if (!first || !second) {
      throw new Error(
        'Выберите два компонента броска.'
      );
    }

    return [
      first,
      second
    ];
  }

  /* =========================
     Режим интерфейса
  ========================= */

  function setRollEditorMode(mode) {
    rollEditorMode =
      mode === 'builder'
        ? 'builder'
        : 'select';

    const selectButton =
      document.getElementById(
        'rollInterfaceSelectButton'
      );

    const builderButton =
      document.getElementById(
        'rollInterfaceBuilderButton'
      );

    if (selectButton) {
      selectButton.classList.toggle(
        'active',
        rollEditorMode === 'select'
      );
    }

    if (builderButton) {
      builderButton.classList.toggle(
        'active',
        rollEditorMode === 'builder'
      );
    }

    document
      .querySelectorAll(
        '.roll-select-only'
      )
      .forEach(function (element) {
        element.classList.toggle(
          'hidden',
          rollEditorMode !== 'select'
        );
      });

    document
      .querySelectorAll(
        '.roll-builder-only'
      )
      .forEach(function (element) {
        element.classList.toggle(
          'hidden',
          rollEditorMode !== 'builder'
        );
      });

    if (rollEditorMode === 'builder') {
      ensureRollBuilderSelection();
      renderRollComponentTables();
    } else {
      syncRollSelectsFromBuilder();
    }

    syncRollBuilderControls();
    toggleRollControlFields();
  }

  function selectRollScene(sceneKey) {
    const select =
      document.getElementById(
        'rollSceneDice'
      );

    if (!select) {
      return;
    }

    select.value = sceneKey;
    syncRollBuilderControls();
  }

  function selectRollControlMethod(
    methodKey
  ) {
    const select =
      document.getElementById(
        'rollControlMethod'
      );

    if (!select) {
      return;
    }

    select.value = methodKey;
    syncRollBuilderControls();
  }

  function selectRandomRollSides(
    sides
  ) {
    const select =
      document.getElementById(
        'randomRollSides'
      );

    if (!select) {
      return;
    }

    select.value = String(sides);
    syncRollBuilderControls();
  }

  function syncRollBuilderControls() {
    const sceneValue =
      document.getElementById(
        'rollSceneDice'
      )?.value || 'normal';

    const controlMethod =
      document.getElementById(
        'rollControlMethod'
      )?.value || 'fixed';

    const randomSides =
      document.getElementById(
        'randomRollSides'
      )?.value || '6';

    document
      .querySelectorAll(
        '#rollSceneButtons ' +
        '[data-scene-key]'
      )
      .forEach(function (button) {
        const selected =
          button.dataset.sceneKey ===
          sceneValue;

        button.classList.toggle(
          'selected',
          selected
        );

        button.setAttribute(
          'aria-pressed',
          selected ? 'true' : 'false'
        );
      });

    document
      .querySelectorAll(
        '.roll-component-square'
      )
      .forEach(function (button) {
        const index =
          rollBuilderSelectedKeys.indexOf(
            button.dataset.componentKey
          );

        const selected =
          index !== -1;

        button.classList.toggle(
          'selected',
          selected
        );

        button.setAttribute(
          'aria-pressed',
          selected ? 'true' : 'false'
        );

        if (selected) {
          button.dataset.selectionOrder =
            String(index + 1);
        } else {
          delete button.dataset.selectionOrder;
        }
      });

    document
      .querySelectorAll(
        '#rollControlMethodButtons ' +
        '[data-control-method]'
      )
      .forEach(function (button) {
        const selected =
          button.dataset.controlMethod ===
          controlMethod;

        button.classList.toggle(
          'selected',
          selected
        );

        button.setAttribute(
          'aria-pressed',
          selected ? 'true' : 'false'
        );
      });

    document
      .querySelectorAll(
        '#randomRollSideButtons ' +
        '[data-random-sides]'
      )
      .forEach(function (button) {
        const selected =
          button.dataset.randomSides ===
          randomSides;

        button.classList.toggle(
          'selected',
          selected
        );

        button.setAttribute(
          'aria-pressed',
          selected ? 'true' : 'false'
        );
      });

    updateRollBuilderSelectionStatus();
  }

  function toggleRollControlFields() {
    const enabled =
      Boolean(
        document.getElementById(
          'rollControlEnabled'
        )?.checked
      );

    const fields =
      document.getElementById(
        'rollControlFields'
      );

    if (fields) {
      fields.classList.toggle(
        'hidden',
        !enabled
      );
    }

    if (enabled) {
      document
        .querySelectorAll(
          '#rollControlFields ' +
          '.roll-select-only'
        )
        .forEach(function (element) {
          element.classList.toggle(
            'hidden',
            rollEditorMode !== 'select'
          );
        });

      document
        .querySelectorAll(
          '#rollControlFields ' +
          '.roll-builder-only'
        )
        .forEach(function (element) {
          element.classList.toggle(
            'hidden',
            rollEditorMode !== 'builder'
          );
        });
    }
  }

  /* =========================
     Бросок Эффективности
  ========================= */

  function setRollStatus(
    elementId,
    message,
    isError
  ) {
    const status =
      document.getElementById(
        elementId
      );

    if (!status) {
      return;
    }

    status.textContent =
      message || '';

    status.className = isError
      ? 'save-status error'
      : 'save-status success';
  }

  function rollEfficiencyNow() {
    let components;

    try {
      components =
        getEfficiencyComponentsForRequest();
    } catch (error) {
      setRollStatus(
        'efficiencyRollStatus',
        error.message,
        true
      );

      return;
    }

    applyCharacterControlMethodToRoll();

    const context =
      getRollCharacterContext();

    const controlEnabled =
      Boolean(
        document.getElementById(
          'rollControlEnabled'
        )?.checked
      );

    const request = {
      title:
        document.getElementById(
          'rollTitle'
        )?.value.trim() || '',

      sceneKey:
        document.getElementById(
          'rollSceneDice'
        )?.value || 'normal',

      difficulty:
        rollNumber(
          document.getElementById(
            'rollDifficulty'
          )?.value,
            7
        ),

      firstComponent:
        components[0],

      secondComponent:
        components[1],

      characterId:
        context.characterId,

      characterName:
        context.characterName,

      className:
        context.className,

      control: {
        enabled:
          controlEnabled,

        methodName:
          document.getElementById(
            'rollControlType'
          )?.value || '',

        methodKey:
          document.getElementById(
            'rollControlMethod'
          )?.value || 'fixed',

        flatBonus:
          rollNumber(
            document.getElementById(
              'rollControlFlatBonus'
            )?.value,
            0
          ),

        difficulty:
          rollNumber(
            document.getElementById(
              'rollControlDifficulty'
            )?.value,
            16
          )
      }
    };

    latestEfficiencyRoll = null;
    selectedEfficiencyDieIndex = null;

    setRollStatus(
      'efficiencyRollStatus',
      'Бросаю кубы...',
      false
    );

    google.script.run
      .withSuccessHandler(
        function (result) {
          latestEfficiencyRoll =
            result;

          setRollStatus(
            'efficiencyRollStatus',
            result.control
              ? 'Осложнение: Контроль выполнен.'
              : 'Бросок выполнен.',
            false
          );

          renderEfficiencyRollResult(
            result
          );

          refreshRollLog(true);
        }
      )
      .withFailureHandler(
        function (error) {
          setRollStatus(
            'efficiencyRollStatus',
            error.message ||
              'Ошибка броска.',
            true
          );
        }
      )
      .mitriniumRollEfficiency(
        request
      );
  }

  function applyBiographyBonusAfterRoll() {
    if (!latestEfficiencyRoll) {
      setRollStatus(
        'efficiencyRollStatus',
        'Сначала выполните бросок.',
        true
      );

      return;
    }

    setRollStatus(
      'efficiencyRollStatus',
      'Применяю биографическую черту...',
      false
    );

    google.script.run
      .withSuccessHandler(
        function (result) {
          latestEfficiencyRoll =
            result;

          setRollStatus(
            'efficiencyRollStatus',
            'Биографическая черта повысила ЭФ на 1.',
            false
          );

          renderEfficiencyRollResult(
            result
          );

          refreshRollLog(true);
        }
      )
      .withFailureHandler(
        function (error) {
          setRollStatus(
            'efficiencyRollStatus',
            error.message ||
              'Ошибка применения биографической черты.',
            true
          );
        }
      )
      .mitriniumApplyBiographyBonus(
        latestEfficiencyRoll
      );
  }

  function selectEfficiencyRerollDie(index) {
    selectedEfficiencyDieIndex =
      selectedEfficiencyDieIndex === index
        ? null
        : index;

    renderEfficiencyRollResult(
      latestEfficiencyRoll
    );
  }

  function getAvailableMainNerveForRoll() {
    if (
      typeof getViewerCharacter !== 'function' ||
      typeof ensureViewerState !== 'function'
    ) {
      return 0;
    }

    const character = getViewerCharacter();

    if (!character) return 0;

    ensureViewerState(character);

    return Math.max(
      0,
      rollNumber(
        viewerState &&
          viewerState.currentMainNerve,
        0
      )
    );
  }

  function rerollSelectedEfficiencyDie() {
    if (!latestEfficiencyRoll) {
      setRollStatus(
        'efficiencyRollStatus',
        'Сначала выполните бросок.',
        true
      );

      return;
    }

    if (selectedEfficiencyDieIndex === null) {
      setRollStatus(
        'efficiencyRollStatus',
        'Выберите один из выпавших кубов.',
        true
      );

      return;
    }

    if (getAvailableMainNerveForRoll() < 1) {
      setRollStatus(
        'efficiencyRollStatus',
        'Для переброса нужен 1 Основной Нерв.',
        true
      );

      return;
    }

    const dieIndex = selectedEfficiencyDieIndex;

    setRollStatus(
      'efficiencyRollStatus',
      'Перебрасываю выбранный куб...',
      false
    );

    google.script.run
      .withSuccessHandler(
        function (result) {
          latestEfficiencyRoll = result;
          selectedEfficiencyDieIndex = null;

          if (
            typeof changeViewerStateValue ===
            'function'
          ) {
            changeViewerStateValue(
              'currentMainNerve',
              -1
            );
          }

          setRollStatus(
            'efficiencyRollStatus',
            'Куб переброшен за 1 Основной Нерв.',
            false
          );

          renderEfficiencyRollResult(result);
          refreshRollLog(true);
        }
      )
      .withFailureHandler(
        function (error) {
          setRollStatus(
            'efficiencyRollStatus',
            error.message ||
              'Ошибка переброса куба.',
            true
          );
        }
      )
      .mitriniumRerollEfficiencyDie(
        latestEfficiencyRoll,
        dieIndex
      );
  }

  /* =========================
     Случайный бросок
  ========================= */

  function rollRandomNow() {
    const context =
      getRollCharacterContext();

    const request = {
      title:
        document.getElementById(
          'randomRollTitle'
        )?.value.trim() || '',

      count:
        rollNumber(
          document.getElementById(
            'randomRollCount'
          )?.value,
          1
        ),

      sides:
        rollNumber(
          document.getElementById(
            'randomRollSides'
          )?.value,
          6
        ),

      modifier:
        rollNumber(
          document.getElementById(
            'randomRollModifier'
          )?.value,
          0
        ),

      characterId:
        context.characterId,

      characterName:
        context.characterName,

      className:
        context.className
    };

    setRollStatus(
      'randomRollStatus',
      'Бросаю кубы...',
      false
    );

    google.script.run
      .withSuccessHandler(
        function (result) {
          setRollStatus(
            'randomRollStatus',
            'Бросок выполнен.',
            false
          );

          renderRandomRollResult(
            result
          );

          refreshRollLog(true);
        }
      )
      .withFailureHandler(
        function (error) {
          setRollStatus(
            'randomRollStatus',
            error.message ||
              'Ошибка броска.',
            true
          );
        }
      )
      .mitriniumRollRandom(
        request
      );
  }

  /* =========================
     Вывод результатов
  ========================= */

  function renderRollDice(dice, selectable) {
    if (
      !Array.isArray(dice) ||
      dice.length === 0
    ) {
      return `
        <span class="empty-note">
          Кубов нет.
        </span>
      `;
    }

    return dice
      .map(function (die, index) {
        const rerolled =
          die.rerolledFrom !==
          undefined;

        const details =
          rerolled
            ? `
              <small>
                ${rollEscapeHtml(
                  die.rerolledFrom
                )}
                → ${rollEscapeHtml(
                  die.value
                )}
              </small>
            `
            : `
              <small>
                ${rollEscapeHtml(
                  die.source ||
                  (
                    'd' +
                    die.sides
                  )
                )}
              </small>
            `;

        const tag = selectable
          ? 'button'
          : 'span';

        const selected =
          selectable &&
          selectedEfficiencyDieIndex === index;

        return `
          <${tag}
            ${
              selectable
                ? 'type="button" onclick="selectEfficiencyRerollDie(' + index + ')"'
                : ''
            }
            class="roll-die${
              rerolled
                ? ' rerolled'
                : ''
            }${
              selectable
                ? ' selectable'
                : ''
            }${
              selected
                ? ' selected'
                : ''
            }"
            ${
              selectable
                ? 'aria-pressed="' + (selected ? 'true' : 'false') + '"'
                : ''
            }
          >
            <strong>
              ${rollEscapeHtml(
                die.value
              )}
            </strong>

            ${details}
          </${tag}>
        `;
      })
      .join('');
  }

  function renderRollSummaryItem(
    label,
    value
  ) {
    return `
      <div class="roll-summary-item">
        <span>
          ${rollEscapeHtml(label)}
        </span>

        <strong>
          ${rollEscapeHtml(value)}
        </strong>
      </div>
    `;
  }

  function renderEfficiencyRollResult(
    result
  ) {
    const container =
      document.getElementById(
        'efficiencyRollResult'
      );

    if (!container || !result) {
      return;
    }

    const biographyNote =
      result.biographyBonus
        ? `
          <p class="roll-replacement-note">
            <strong>Биографическая черта:</strong>
            +1 ЭФ.
          </p>
        `
        : '';

    const biographyAction =
      result.biographyBonus
        ? `
          <div class="roll-result-action-note">
            Биографическая черта уже применена.
          </div>
        `
        : `
          <button
            type="button"
            class="secondary-button"
            onclick="applyBiographyBonusAfterRoll()"
          >
            Применить биографическую черту: +1 ЭФ
          </button>
        `;

    const mainNerve =
      getAvailableMainNerveForRoll();

    const rerollAction = `
      <button
        type="button"
        class="secondary-button"
        onclick="rerollSelectedEfficiencyDie()"
        ${
          selectedEfficiencyDieIndex === null ||
          mainNerve < 1
            ? 'disabled'
            : ''
        }
      >
        Перебросить выбранный куб — 1 Основной Нерв
      </button>

      <p class="helper-note">
        Доступно Основного Нерва: ${rollEscapeHtml(mainNerve)}.
        Бонусный Нерв для перебросов не используется.
      </p>
    `;

    const control =
      result.control
        ? renderControlResult(
            result.control
          )
        : '';

    container.className =
      'roll-result';

    container.innerHTML = `
      <div class="roll-result-heading">
        <div>
          <strong>
            ${rollEscapeHtml(
              result.title
            )}
          </strong>

          <div class="roll-status-line">
            ${rollEscapeHtml(
              result.components[0].label
            )}
            +
            ${rollEscapeHtml(
              result.components[1].label
            )}
          </div>
        </div>

        <div class="roll-result-number">
          ЭФ
          ${rollEscapeHtml(
            result.finalEf
          )}
        </div>
      </div>

      <div class="roll-dice">
        ${renderRollDice(
          result.dice,
          true
        )}
      </div>

      ${biographyNote}

      <div class="roll-summary-grid">
        ${renderRollSummaryItem(
          'Результат',
          result.success
            ? 'Успех'
            : 'Провал'
        )}

        ${renderRollSummaryItem(
          'Сложность',
          result.difficulty +
            ' — ' +
            result.difficultyLabel
        )}

        ${renderRollSummaryItem(
          'Доступный уровень',
          result.outcome
        )}

        ${renderRollSummaryItem(
          'Осложнение',
          result.complication
        )}

        ${renderRollSummaryItem(
          'Прорыв',
          result.breakthrough
        )}

        ${renderRollSummaryItem(
          'Формула ЭФ',
          result.topValues.join(' + ') +
          ' − ' +
          result.bottomValues.join(' + ')
        )}
      </div>

      ${control}

      <div class="roll-result-actions">
        ${biographyAction}
        ${rerollAction}
      </div>
    `;
  }

  function renderRandomRollResult(
    result
  ) {
    const container =
      document.getElementById(
        'randomRollResult'
      );

    if (!container || !result) {
      return;
    }

    const modifierText =
      result.modifier >= 0
        ? '+' + result.modifier
        : String(result.modifier);

    container.className =
      'roll-result';

    container.innerHTML = `
      <div class="roll-result-heading">
        <div>
          <strong>
            ${rollEscapeHtml(
              result.title
            )}
          </strong>

          <div class="roll-status-line">
            ${rollEscapeHtml(
              result.count
            )}d${rollEscapeHtml(
              result.sides
            )}

            ${rollEscapeHtml(
              modifierText
            )}
          </div>
        </div>

        <div class="roll-result-number">
          ${rollEscapeHtml(
            result.total
          )}
        </div>
      </div>

      <div class="roll-dice">
        ${renderRollDice(
          result.dice
        )}
      </div>

      <div class="roll-summary-grid">
        ${renderRollSummaryItem(
          'Сумма кубов',
          result.diceSum
        )}

        ${renderRollSummaryItem(
          'Модификатор',
          modifierText
        )}
      </div>
    `;
  }

  function renderControlResult(control) {
    const methodLabel = control.methodName || 'Методика';

    return `
      <div class="roll-control-result">
        <strong>
          Контроль:
          ${rollEscapeHtml(
            control.total
          )}
          против
          ${rollEscapeHtml(
            control.difficulty
          )}
          —
          ${
            control.success
              ? 'успех'
              : 'провал'
          }.
        </strong>

        <div class="roll-status-line">
          d20:
          ${rollEscapeHtml(
            control.d20
          )};

          Методика:
          ${rollEscapeHtml(
            methodLabel
          )};

          бонус:
          ${rollEscapeHtml(
            control.flatBonus
          )}.
        </div>
      </div>
    `;
  }

  /* =========================
     Лог
  ========================= */

  function refreshRollLog(silent) {
    const list =
      document.getElementById(
        'rollLogList'
      );

    if (!list) {
      return;
    }

    if (!silent) {
      setRollStatus(
        'rollLogStatus',
        'Загружаю лог...',
        false
      );
    }

    google.script.run
      .withSuccessHandler(
        function (result) {
          rollLogIsAdmin =
            Boolean(
              result &&
              result.isAdmin
            );

          rollLogEntries = result && result.entries ? result.entries : [];
          renderRollLog(rollLogEntries);

          updateClearRollLogButton();

          setRollStatus(
            'rollLogStatus',
            '',
            false
          );
        }
      )
      .withFailureHandler(
        function (error) {
          setRollStatus(
            'rollLogStatus',
            error.message ||
              'Ошибка загрузки лога.',
            true
          );
        }
      )
      .mitriniumGetRollLog(100);
  }

  function downloadRollLogCsv(entries) {
    const columns = [
      'timestamp','userEmail','characterName','className','type','title',
      'finalResult','ef','damage','complication','breakthrough','adminOnly','dice','control','details'
    ];
    const quote = function(value) {
      return '"' + String(value ?? '').replace(/"/g, '""') + '"';
    };
    const rows = [columns.map(quote).join(',')].concat(
      (entries || []).map(function(entry) {
        const row = Object.assign({}, entry, {
          dice: JSON.stringify(entry.dice || []),
          damage: entry.details && entry.details.damage !== undefined ? entry.details.damage : '',
          control: entry.control ? JSON.stringify(entry.control) : '',
          details: entry.details ? JSON.stringify(entry.details) : ''
        });
        return columns.map(function(key) { return quote(row[key]); }).join(',');
      })
    );
    const blob = new Blob(['\ufeff' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'mitrinium-roll-log-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
  }

  function exportRollLogCsv() {
    setRollStatus('rollLogStatus', 'Готовлю полный экспорт...', false);
    google.script.run
      .withSuccessHandler(function(result) {
        const entries = result && result.entries ? result.entries : [];
        downloadRollLogCsv(entries);
        setRollStatus('rollLogStatus', 'CSV-файл сформирован: ' + entries.length + ' записей.', false);
      })
      .withFailureHandler(function(error) {
        setRollStatus('rollLogStatus', error.message || 'Ошибка экспорта лога.', true);
      })
      .mitriniumGetRollLog(5000);
  }

  function renderRollLog(entries) {
  const list =
    document.getElementById(
      'rollLogList'
    );

  if (!list) {
    return;
  }

  if (
    !Array.isArray(entries) ||
    entries.length === 0
  ) {
    list.innerHTML = `
      <p class="empty-note">
        Лог бросков пуст.
      </p>
    `;

    return;
  }

  list.innerHTML =
    entries
      .map(function (entry) {
        const icon =
          entry.classIcon
            ? `
              <span
                class="class-icon-inline"
                aria-hidden="true"
              >
                ${renderClassIconGlyph(
                  entry.className,
                  entry.classIcon
                )}
              </span>
            `
            : '';

        const resultText =
          entry.type ===
          'efficiency'
            ? (
                'ЭФ ' +
                rollEscapeHtml(
                  entry.ef
                )
              )
            : (
                'Итог ' +
                rollEscapeHtml(
                  entry.finalResult
                )
              );

        const controlHtml =
          entry.type ===
            'efficiency' &&
          entry.control
            ? renderControlResult(
                entry.control
              )
            : '';

        const hasComplication =
          entry.complication ===
          'Осложнение';

        const hasBreakthrough =
          entry.breakthrough ===
          'Прорыв';

        const eventBadges = `
          ${
            hasComplication
              ? '<span class="roll-event-badge complication">Осложнение</span>'
              : ''
          }
          ${
            hasBreakthrough
              ? '<span class="roll-event-badge breakthrough">Прорыв</span>'
              : ''
          }
        `;

        const damage = entry.details && entry.details.damage !== undefined
          ? entry.details.damage
          : null;
        const highlights = entry.type === 'efficiency' || damage !== null
          ? `
            <div class="roll-log-highlights">
              ${entry.type === 'efficiency'
                ? `<div class="roll-log-highlight ef"><span>ЭФ</span><strong>${rollEscapeHtml(entry.ef)}</strong></div>`
                : ''}
              ${damage !== null
                ? `<div class="roll-log-highlight damage"><span>Урон</span><strong>${rollEscapeHtml(damage)}</strong></div>`
                : ''}
            </div>
          `
          : '';
        const isEvent = entry.type === 'event';

        return `
          <article class="roll-log-entry${
            hasComplication
              ? ' has-complication'
              : ''
          }${
            hasBreakthrough
              ? ' has-breakthrough'
              : ''
          }">
            <div class="roll-log-entry-heading">
              <div class="roll-log-entry-title">
                ${icon}

                ${rollEscapeHtml(
                  entry.characterName ||
                  'Без имени'
                )}
                ${entry.adminOnly ? '<span class="roll-admin-only-badge">Только админам</span>' : ''}
              </div>

              <time class="roll-log-entry-time">
                ${rollEscapeHtml(
                  formatRollLogTime(
                    entry.timestamp
                  )
                )}
              </time>
            </div>

            <div class="roll-log-entry-meta">
              ${rollEscapeHtml(
                entry.title ||
                'Бросок'
              )}

              ${isEvent ? '' : `· <strong>${resultText}</strong>`}

              <span class="roll-event-badges">
                ${eventBadges}
              </span>
            </div>

            ${highlights}

            ${(entry.dice || []).length ? `<div class="roll-dice">${renderRollDice(entry.dice || [])}</div>` : ''}

            ${controlHtml}
          </article>
        `;
      })
      .join('');
}

  function formatRollLogTime(value) {
    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return String(value || '');
    }

    return date.toLocaleString(
      'ru-RU',
      {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      }
    );
  }

  function updateClearRollLogButton() {
    const button =
      document.getElementById(
        'clearRollLogButton'
      );

    if (button) {
      button.classList.toggle(
        'hidden',
        !rollLogIsAdmin
      );
    }
  }

  function clearRollLogFromApp() {
    if (!rollLogIsAdmin) {
      return;
    }

    setRollStatus(
      'rollLogStatus',
      'Очищаю лог...',
      false
    );

    google.script.run
      .withSuccessHandler(
        function () {
          setRollStatus(
            'rollLogStatus',
            'Лог очищен.',
            false
          );

          refreshRollLog(true);
        }
      )
      .withFailureHandler(
        function (error) {
          setRollStatus(
            'rollLogStatus',
            error.message ||
              'Ошибка очистки лога.',
            true
          );
        }
      )
      .mitriniumClearRollLog();
  }

  function startRollLogPolling() {
    if (rollLogTimer) {
      return;
    }

    rollLogTimer =
      window.setInterval(
        function () {
          if (
            typeof appMode !==
            'undefined' &&
            appMode === 'rolls'
          ) {
            refreshRollLog(true);
          }
        },
        12000
      );
  }

  /* =========================
     Запуск
  ========================= */

  document.addEventListener(
    'DOMContentLoaded',
    function () {
      renderRollComponentOptions();
      renderRollTurnTracker();
      toggleRollControlFields();
      setRollEditorMode('select');
      applyCharacterControlMethodToRoll();
      startRollLogPolling();
    }
  );
</script>
